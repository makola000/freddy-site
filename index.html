<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY CHAT ULTIME 🚀</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#25D366">
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#111b21;color:white;display:flex;flex-direction:column;height:100vh}
.header{background:#202c33;padding:12px;display:flex;justify-content:space-between;align-items:center}
.header b{color:#25D366}
#online{font-size:12px;color:#25D366}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;word-break:break-word;position:relative}
.me{align-self:flex-end;background:#005c4b}
.other{align-self:flex-start;background:#202c33}
.msg img{max-width:100%;border-radius:10px;margin-top:5px}
.msg audio{margin-top:5px;width:100%}
.time{font-size:10px;opacity:0.6;margin-top:4px;text-align:right}
.input-area{display:flex;padding:10px;background:#202c33;gap:5px;align-items:center}
input{padding:12px;border-radius:20px;border:none;outline:none}
#nameInput{width:70px}
#msgInput{flex:1}
.icon-btn{background:#2a3942;border:none;color:white;font-size:18px;border-radius:50%;width:40px;height:40px;cursor:pointer}
.send-btn{background:#25D366;border:none;color:white;font-weight:bold;padding:10px 16px;border-radius:20px;cursor:pointer}
.emoji-panel{display:none;background:#202c33;padding:8px;flex-wrap:wrap;gap:5px}
.emoji-panel span{font-size:22px;cursor:pointer;padding:4px}
#videoContainer{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:100;flex-direction:column}
#videoContainer iframe{flex:1;border:none}
</style>
</head>
<body>
<div class="header">
<div><b>FREDDY CHAT</b> <span id="online">● 1 en ligne</span></div>
<div><button class="icon-btn" onclick="startVideo()" style="background:#25D366">📹</button></div>
</div>

<div id="messages"></div>

<div class="emoji-panel" id="emojiPanel">
<span>😀</span><span>😂</span><span>❤️</span><span>🔥</span><span>👍</span><span>🎉</span><span>😭</span><span>🙏</span><span>💀</span><span>😎</span><span>🥰</span><span>😍</span><span>👏</span><span>🤣</span><span>😮</span><span>😢</span><span>🇨🇩</span>
</div>

<div class="input-area">
<input id="nameInput" placeholder="Nom">
<button class="icon-btn" onclick="toggleEmoji()">😊</button>
<input id="msgInput" placeholder="Message...">
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="sendImage(this)">
<button class="icon-btn" onclick="document.getElementById('fileInput').click()">📷</button>
<button class="icon-btn" id="micBtn" onclick="toggleRecord()">🎤</button>
<button class="send-btn" onclick="send()">➤</button>
</div>

<div id="videoContainer">
<div style="padding:10px;background:#202c33;display:flex;justify-content:space-between"><b>Appel Vidéo Freddy</b><button onclick="stopVideo()" style="background:red;border:none;color:white;padding:8px 15px;border-radius:10px">Quitter</button></div>
<iframe id="jitsi" allow="camera; microphone; fullscreen; display-capture"></iframe>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDfdD2GeWkP3_jR0UOF8XOo0YY2OHhh7_A",
  authDomain: "freddy-chat-d7685.firebaseapp.com",
  databaseURL: "https://freddy-chat-d7685-default-rtdb.firebaseio.com",
  projectId: "freddy-chat-d7685",
  storageBucket: "freddy-chat-d7685.firebasestorage.app",
  messagingSenderId: "995847135839",
  appId: "1:995847135839:web:cb599b4ec1798a7a0cb1ea"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const chatRef = ref(db, "messages");
const presenceRef = ref(db, "presence");

const messagesDiv = document.getElementById("messages");
const colors = {};
function getColor(name){
  if(!colors[name]){
    const cols = ["#e91e63","#2196f3","#ff9800","#4caf50","#9c27b0","#00bcd4","#ffeb3b","#ff5722"];
    colors[name]=cols[Math.floor(Math.random()*cols.length)];
  }
  return colors[name];
}

onChildAdded(chatRef, (snap) => {
  const d = snap.val();
  const div = document.createElement("div");
  const myName = document.getElementById("nameInput").value;
  div.className = "msg " + (d.name === myName ? "me" : "other");
  let content = `<b style="color:${getColor(d.name)}">${d.name}</b><br>${d.text || ""}`;
  if(d.image) content += `<br><img src="${d.image}">`;
  if(d.audio) content += `<br><audio controls src="${d.audio}"></audio>`;
  const date = new Date(d.time); const h = date.getHours()+":"+String(date.getMinutes()).padStart(2,"0");
  content += `<div class="time">${h} ✓✓ vu</div>`;
  div.innerHTML = content;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
});

// PRESENCE EN LIGNE
const myPresence = push(presenceRef);
set(myPresence, {online:true});
onDisconnect(myPresence).remove();
onValue(presenceRef, (s)=>{
  const count = s.val() ? Object.keys(s.val()).length : 0;
  document.getElementById("online").textContent = `● ${count} en ligne`;
});

window.send = function() {
  const name = document.getElementById("nameInput").value || "Anonyme";
  const text = document.getElementById("msgInput").value;
  if(!text.trim()) return;
  push(chatRef, { name, text, time: Date.now() });
  document.getElementById("msgInput").value = "";
}
window.sendImage = function(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const name = document.getElementById("nameInput").value || "Anonyme";
    push(chatRef, { name, image: e.target.result, time: Date.now() });
  }; reader.readAsDataURL(file);
}
window.toggleEmoji = function(){
  const p=document.getElementById("emojiPanel");
  p.style.display = p.style.display==="flex"?"none":"flex";
}
document.querySelectorAll("#emojiPanel span").forEach(s=>{
  s.onclick = ()=>{ document.getElementById("msgInput").value += s.textContent; }
});
let mediaRecorder, chunks=[], recording=false;
window.toggleRecord = async function(){
  const btn=document.getElementById("micBtn");
  if(!recording){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream); chunks=[];
      mediaRecorder.ondataavailable=e=>chunks.push(e.data);
      mediaRecorder.onstop=()=>{
        const blob=new Blob(chunks,{type:"audio/webm"});
        const reader=new FileReader();
        reader.onload=e=>{
          const name=document.getElementById("nameInput").value||"Anonyme";
          push(chatRef,{name,audio:e.target.result,time:Date.now()});
        }; reader.readAsDataURL(blob);
      };
      mediaRecorder.start(); recording=true; btn.textContent="⏹️"; btn.style.background="red";
    }catch(e){alert("Micro non autorisé");}
  }else{ mediaRecorder.stop(); recording=false; btn.textContent="🎤"; btn.style.background="#2a3942"; }
}
window.startVideo = function(){
  document.getElementById("videoContainer").style.display="flex";
  const room = "FREDDY-CHAT-"+Date.now();
  document.getElementById("jitsi").src=`https://meet.jit.si/${room}#config.startWithAudioMuted=false&config.startWithVideoMuted=false`;
}
window.stopVideo = function(){
  document.getElementById("videoContainer").style.display="none";
  document.getElementById("jitsi").src="";
}
document.getElementById("msgInput").addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
