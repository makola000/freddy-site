<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freddy Chat</title><style>body{margin:0;font-family:Arial;background:#111b21;color:#fff;display:flex;flex-direction:column;height:100vh}header{background:#202c33;padding:15px;text-align:center;font-weight:bold;color:#25D366} #messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;background:#0b141a} .msg{padding:8px 12px;border-radius:8px;max-width:80%;position:relative} .me{background:#005c4b;align-self:flex-end} .other{background:#202c33;align-self:flex-start} .del{font-size:10px;color:#ff4444;cursor:pointer;margin-top:4px;display:block} #form{display:flex;padding:10px;background:#202c33;gap:10px} input{flex:1;padding:12px;border-radius:20px;border:none;outline:none} button{padding:12px 20px;border-radius:20px;border:none;background:#25D366;color:#fff;font-weight:bold;cursor:pointer} #box{padding:20px;text-align:center;background:#202c33}</style></head><body><header>FREDDY CHAT ULTIME - <button onclick="clearAll()" style="background:red;padding:5px 10px;font-size:12px">EFFACER TOUT</button></header><div id="box"><h3>Entre ton prénom</h3><input id="username" placeholder="Ex: Freddy"><br><br><button onclick="saveName()">ENTRER</button></div><div id="messages"></div><div id="form" style="display:none"><input id="text" placeholder="Message..."><button onclick="sendMsg()">Envoyer</button></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,push,onChildAdded,remove}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyDfY6UU7H6tkhFX2BCm17haprCP-gBDmhY",authDomain:"freddy-chat-be9da.firebaseapp.com",databaseURL:"https://freddy-chat-be9da-default-rtdb.firebaseio.com",projectId:"freddy-chat-be9da",storageBucket:"freddy-chat-be9da.firebasestorage.app",messagingSenderId:"383693224398",appId:"1:383693224398:web:7c1f193021bec3c962139f"};const app=initializeApp(firebaseConfig);const db=getDatabase(app);let myName=localStorage.getItem("freddy_name")||"";if(myName){document.getElementById("box").style.display="none";document.getElementById("form").style.display="flex"}window.saveName=()=>{const v=document.getElementById("username").value.trim();if(!v)return alert("prenom");myName=v;localStorage.setItem("freddy_name",v);document.getElementById("box").style.display="none";document.getElementById("form").style.display="flex"};window.sendMsg=()=>{const t=document.getElementById("text").value.trim();if(!t)return;document.getElementById("text").value="";push(ref(db,"messages"),{name:myName,text:t,time:Date.now()})};onChildAdded(ref(db,"messages"),(snap)=>{const m=snap.val();const id=snap.key;const div=document.getElementById("messages");const el=document.createElement("div");el.id=id;el.className="msg "+(m.name===myName?"me":"other");el.innerHTML=`<small style="color:#25D366">${m.name}</small><br>${m.text}<span class="del" onclick="delMsg('${id}')">❌ Supprimer</span>`;div.appendChild(el);div.scrollTop=div.scrollHeight});window.delMsg=(id)=>{if(confirm("Supprimer ce message ?")){remove(ref(db,"messages/"+id));document.getElementById(id)?.remove()}};window.clearAll=()=>{if(confirm("EFFACER TOUT LE CHAT ?")){remove(ref(db,"messages"));document.getElementById("messages").innerHTML=""}};</script></body></html>
