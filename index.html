<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>FREDDY ULTIME PRO</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#111b21;color:#fff;height:100vh;display:flex;flex-direction:column}header{background:#202c33;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}header .logo{display:flex;gap:10px;align-items:center}header .logo div{width:40px;height:40px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold} .online{font-size:11px;color:#25D366} .actions i{margin-left:15px;cursor:pointer} #messages{flex:1;overflow-y:auto;padding:16px;background:#0b141a url('https://i.ibb.co/3s1S6hZ/wall.png');display:flex;flex-direction:column;gap:8px} .msg{max-width:75%;padding:8px 10px 20px 10px;border-radius:8px;position:relative;word-break:break-word} .me{background:#005c4b;align-self:flex-end;border-radius:8px 0 8px 8px} .other{background:#202c33;align-self:flex-start;border-radius:0 8px 8px 8px} .msg small{display:block;font-size:11px;font-weight:bold;color:#53bdeb} .time{position:absolute;bottom:2px;right:8px;font-size:10px;color:#ffffff99} .del{position:absolute;top:2px;right:5px;cursor:pointer;font-size:10px;opacity:.5} .msg img{max-width:200px;border-radius:8px;margin-top:5px} #login{position:fixed;inset:0;background:#111b21;z-index:99;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px} #login input{width:100%;max-width:300px;padding:14px;border-radius:8px;border:none;margin:10px 0} #login button{width:100%;max-width:300px;padding:14px;background:#25D366;border:none;border-radius:8px;color:#fff;font-weight:bold} #form{background:#202c33;padding:8px;display:flex;align-items:center;gap:8px} #form input[type=text]{flex:1;padding:12px 15px;border-radius:25px;border:none;background:#2a3942;color:#fff;outline:none} #form button{width:45px;height:45px;border-radius:50%;border:none;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer} #emojiBox{display:none;padding:10px;background:#202c33;gap:5px;flex-wrap:wrap} #emojiBox span{font-size:22px;cursor:pointer;padding:5px}</style></head><body>
<header><div class="logo"><div>F</div><div><div>FREDDY CHAT PRO</div><div class="online"><i class="fa fa-circle"></i> en ligne - <span id="count">1</span> connectés</div></div></div><div class="actions"><i class="fa fa-trash" onclick="clearAll()" title="Tout effacer"></i><a href="https://wa.me/243000000000" target="_blank" style="color:#fff"><i class="fab fa-whatsapp"></i></a></div></header>
<div id="messages"></div>
<div id="emojiBox"><span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🙏')">🙏</span><span onclick="addEmoji('😭')">😭</span><span onclick="addEmoji('💪')">💪</span><span onclick="addEmoji('🥰')">🥰</span><span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('👍')">👍</span></div>
<div id="form"><button onclick="toggleEmoji()"><i class="fa fa-face-smile"></i></button><input id="text" type="text" placeholder="Message..."><label for="imgInput" style="cursor:pointer"><i class="fa fa-camera" style="padding:10px"></i></label><input type="file" id="imgInput" accept="image/*" style="display:none"><button id="micBtn" onclick="recordVoice()"><i class="fa fa-microphone"></i></button><button onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button></div>
<div id="login"><h2 style="color:#25D366;margin-bottom:20px">FREDDY ULTIME</h2><input id="username" placeholder="Ton prénom (ex: Freddy)"><button onclick="saveName()">COMMENCER À CHATTER 🚀</button><p style="margin-top:20px;font-size:12px;color:#888">Version 1,2,3 combinée - Images + Vocaux + Online</p></div>
<audio id="notif" src="https://cdn.pixabay.com/audio/2021/08/04/audio_0625c1539c.mp3"></audio>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,push,onChildAdded,remove}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";import{getStorage,ref as sRef,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyDfY6UU7H6tkhFX2BCm17haprCP-gBDmhY",authDomain:"freddy-chat-be9da.firebaseapp.com",databaseURL:"https://freddy-chat-be9da-default-rtdb.firebaseio.com",projectId:"freddy-chat-be9da",storageBucket:"freddy-chat-be9da.firebasestorage.app",messagingSenderId:"383693224398",appId:"1:383693224398:web:7c1f193021bec3c962139f"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);const storage=getStorage(app);
let myName=localStorage.getItem("freddy_name")||"";if(myName){document.getElementById("login").style.display="none"}
window.saveName=()=>{let v=document.getElementById("username").value.trim();if(!v)return alert("Entre ton prénom");myName=v;localStorage.setItem("freddy_name",v);document.getElementById("login").style.display="none"};
window.toggleEmoji=()=>{let b=document.getElementById("emojiBox");b.style.display=b.style.display==="flex"?"none":"flex"};window.addEmoji=(e)=>{document.getElementById("text").value+=e};
window.sendMsg=async(textOverride,imgUrl,audioUrl)=>{let t=textOverride||document.getElementById("text").value.trim();if(!t&&!imgUrl&&!audioUrl)return;document.getElementById("text").value="";let data={name:myName,text:t,time:Date.now(),img:imgUrl||"",audio:audioUrl||""};push(ref(db,"messages"),data)};
onChildAdded(ref(db,"messages"),snap=>{const m=snap.val();const id=snap.key;const div=document.getElementById("messages");const isMe=m.name===myName;let html=`<small>${m.name}</small>`;if(m.text)html+=`<div>${m.text}</div>`;if(m.img)html+=`<img src="${m.img}">`;if(m.audio)html+=`<audio controls src="${m.audio}" style="max-width:180px"></audio>`;html+=`<span class="time">${new Date(m.time).toLocaleTimeString().slice(0,5)}</span><span class="del" onclick="delMsg('${id}')">x</span>`;let el=document.createElement("div");el.className="msg "+(isMe?"me":"other");el.id=id;el.innerHTML=html;div.appendChild(el);div.scrollTop=div.scrollHeight;if(!isMe)try{document.getElementById("notif").play()}catch(e){}document.getElementById("count").innerText=div.children.length;});
window.delMsg=id=>{if(confirm("Supprimer ?")){remove(ref(db,"messages/"+id));document.getElementById(id)?.remove()}};window.clearAll=()=>{if(confirm("EFFACER TOUT LE CHAT ?")){remove(ref(db,"messages"));document.getElementById("messages").innerHTML=""}};
document.getElementById("imgInput").addEventListener("change",async e=>{let file=e.target.files[0];if(!file)return;let st=sRef(storage,"images/"+Date.now()+"_"+file.name);await uploadBytes(st,file);let url=await getDownloadURL(st);sendMsg("",url,"")});
let recorder,chunks=[];window.recordVoice=async()=>{let btn=document.getElementById("micBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.innerHTML='<i class="fa fa-microphone"></i>';return}let stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{let blob=new Blob(chunks,{type:"audio/webm"});let st=sRef(storage,"vocals/"+Date.now()+".webm");await uploadBytes(st,blob);let url=await getDownloadURL(st);sendMsg("🎤 Vocal", "", url)};recorder.start();btn.innerHTML='<i class="fa fa-stop" style="color:red"></i>';alert("Enregistrement... Clique stop pour envoyer")};
</script></body></html>
