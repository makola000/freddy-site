<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FREDDY V4.1 FIX</title><meta name="theme-color" content="#25D366"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#111b21;color:#fff;display:flex;height:100vh}aside{width:70px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column;align-items:center;padding:6px;gap:6px}aside div{width:42px;height:42px;background:#202c33;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}#main{flex:1;display:flex;flex-direction:column}header{background:#202c33;padding:6px;display:flex;gap:6px;align-items:center}header input{flex:1;padding:10px;border-radius:20px;border:none;background:#2a3942;color:#fff}#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.msg{max-width:80%;padding:8px 12px 18px;border-radius:8px;position:relative}.me{background:#005c4b;align-self:flex-end}.other{background:#202c33;align-self:flex-start}.msg img,.msg video{max-width:200px;border-radius:8px;margin-top:4px;display:block}.msg audio{max-width:200px}.overlay{position:fixed;inset:0;background:#0f0f0f;z-index:15;display:none;flex-direction:column}.head{background:#202c33;padding:10px;display:flex;gap:6px;align-items:center}.head input{flex:1;padding:10px;border-radius:20px;border:none;background:#2a3942;color:#fff}#form{background:#202c33;padding:6px;display:flex;gap:4px;align-items:center}#form input{flex:1;padding:11px;border-radius:20px;border:none;background:#2a3942;color:#fff}#form button{width:36px;height:36px;border-radius:50%;border:none;background:#25D366;color:#fff}#videoBox{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}#videoBox iframe{flex:1;border:none}.full{flex:1;border:none;width:100%}#login{position:fixed;inset:0;background:#111b21;z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px}.contact{background:#202c33;padding:10px;border-radius:10px;margin:6px;display:flex;justify-content:space-between}.card{background:#1f2c34;padding:10px;border-radius:12px;margin:8px 0}</style></head><body>
<aside><div onclick="showPage('chat')">💬</div><div onclick="showPage('contacts')">📇</div><div onclick="showPage('status')">🎥</div><div onclick="showPage('youtube')" style="background:#FF0000">▶️</div><div onclick="showPage('google')" style="background:#4285F4">G</div><div onclick="openVideo('MONDE')">📹</div><div style="margin-top:auto;background:#25D366;font-weight:bold">F</div></aside>
<div id="main"><header><input id="search" placeholder="🔍 Rechercher dans l'app..." oninput="doSearch(this.value)"><span onclick="openVideo('chat')" style="background:#25D366;padding:6px 12px;border-radius:20px">📹</span></header><div style="background:#202c33;padding:4px 10px;font-size:12px"><b id="chatName">FREDDY V4.1</b> <span style="color:#25D366">● N°1 MONDIAL FIX</span> <small id="typing" style="color:#53bdeb"></small></div><div id="msgs"></div><div id="searchRes" style="display:none;flex:1;overflow:auto;padding:10px;background:#0b141a"></div><div id="form"><input id="text" type="text" placeholder="Message, lien YouTube..."><input type="file" id="img" accept="image/*,video/*" style="display:none"><button onclick="document.getElementById('img').click()">📷</button><button id="micBtn" onclick="toggleRec()">🎤</button><button onclick="send()">➤</button></div></div>
<div id="contacts" class="overlay"><div class="head"><h3 style="flex:1">📇 Contacts</h3><button onclick="hidePages()" style="background:red;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div><div style="padding:10px"><div style="display:flex;gap:6px"><input id="cName" placeholder="Nom" style="flex:1;padding:10px;border-radius:8px;border:none"><input id="cNum" placeholder="Numéro" style="flex:1;padding:10px;border-radius:8px;border:none"><button onclick="addContact()" style="padding:10px;background:#25D366;border:none;border-radius:8px">+</button></div><div id="cList"></div></div></div>
<div id="statusPage" class="overlay"><div class="head"><h3 style="flex:1">🎥 Statuts</h3><button onclick="hidePages()" style="background:red;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div><div style="padding:10px"><div style="display:flex;gap:6px"><input id="sText" placeholder="Quoi de neuf ?" style="flex:1;padding:10px;border-radius:8px;border:none"><input type="file" id="sImg" accept="image/*,video/*" style="display:none"><button onclick="document.getElementById('sImg').click()" style="padding:10px;background:#2a3942;border:none;border-radius:8px">📷🎥</button><button onclick="addStatus()" style="padding:10px;background:#25D366;border:none;border-radius:8px">Poster</button></div><div id="sList"></div></div></div>
<div id="youtube" class="overlay"><div class="head"><input id="ytSearch" placeholder="🔍 YouTube: Fally, Dadju, actu..." onkeydown="if(event.key=='Enter')searchYT()"><button onclick="searchYT()" style="background:#FF0000;color:#fff;padding:10px 16px;border-radius:20px;border:none">▶️</button><button onclick="hidePages()" style="background:#333;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div><div style="padding:6px;display:flex;gap:6px;overflow:auto"><button onclick="quickYT('musique congolaise 2024')" style="padding:6px 12px;border-radius:20px;border:none;background:#202c33;color:#fff">🇨🇩 Musique</button><button onclick="quickYT('comédie congolaise')" style="padding:6px 12px;border-radius:20px;border:none;background:#202c33;color:#fff">😂 Comédie</button><button onclick="quickYT('actualités RDC')" style="padding:6px 12px;border-radius:20px;border:none;background:#202c33;color:#fff">📰 Actu</button><button onclick="quickYT('football live')" style="padding:6px 12px;border-radius:20px;border:none;background:#202c33;color:#fff">⚽ Foot</button></div><div id="ytPlayerWrap" style="display:none;background:#000;padding:6px"><div style="display:flex;justify-content:space-between;align-items:center"><span id="ytNow">▶️ Lecture</span><div><button onclick="shareYT()" style="background:#25D366;padding:6px 12px;border-radius:20px;border:none;color:#fff">Partager dans chat ➤</button> <button onclick="document.getElementById('ytPlayerWrap').style.display='none';document.getElementById('ytPlayer').src=''" style="background:red;padding:6px 12px;border-radius:20px;border:none;color:#fff">Fermer</button></div></div><iframe id="ytPlayer" class="full" style="height:280px;margin-top:6px" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe></div><iframe id="ytFrame" class="full" allow="encrypted-media;fullscreen" allowfullscreen></iframe></div>
<div id="googlePage" class="overlay"><div class="head"><input id="gSearch" placeholder="🔍 Google..." onkeydown="if(event.key=='Enter')searchG()"><button onclick="searchG()" style="background:#4285F4;color:#fff;padding:10px 16px;border-radius:20px;border:none">G</button><button onclick="hidePages()" style="background:#333;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div><iframe id="gFrame" class="full"></iframe></div>
<div id="videoBox"><div style="background:#202c33;padding:10px;display:flex;justify-content:space-between"><span id="videoTitle">📹</span><span onclick="document.getElementById('videoBox').style.display='none';document.getElementById('videoFrame').src=''" style="background:red;padding:6px 14px;border-radius:20px">❌</span></div><iframe id="videoFrame" allow="camera;microphone"></iframe></div>
<div id="login"><h1 style="color:#25D366">FREDDY V4.1 N°1 🌍</h1><p style="text-align:center">Chat + YouTube qui marche + Google</p><input id="name" placeholder="Ton prénom" style="padding:14px;width:100%;max-width:300px;border-radius:8px;border:none;margin:10px"><button onclick="save()" style="padding:14px;width:100%;max-width:300px;background:#25D366;border:none;border-radius:8px;color:#fff;font-weight:bold">ENTRER 🚀</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,push,onChildAdded,set,onValue}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const config={apiKey:"AIzaSyDfY6UU7H6tkhFX2BCm17haprCP-gBDmhY",authDomain:"freddy-chat-be9da.firebaseapp.com",databaseURL:"https://freddy-chat-be9da-default-rtdb.firebaseio.com",projectId:"freddy-chat-be9da",appId:"1:383693224398:web:7c1f193021bec3c962139f"};
const app=initializeApp(config);const db=getDatabase(app);
let myName=localStorage.getItem("freddy_name")||"";if(myName)document.getElementById("login").style.display="none";
window.save=()=>{let v=document.getElementById("name").value.trim();if(!v)return;myName=v;localStorage.setItem("freddy_name",v);document.getElementById("login").style.display="none"};
let contacts=JSON.parse(localStorage.getItem("freddy_contacts")||"[]");let allMsgs=[],currentYT="";let allStatus=[];
window.showPage=(p)=>{hidePages();document.getElementById(p=="chat"?"main":p=="contacts"?"contacts":p=="status"?"statusPage":p=="youtube"?"youtube":p=="google"?"googlePage":"main").style.display="flex";if(p=='contacts')renderContacts();if(p=='google'&&!document.getElementById("gFrame").src)searchG()};window.hidePages=()=>{document.querySelectorAll('.overlay').forEach(e=>e.style.display='none');document.getElementById("searchRes").style.display="none";document.getElementById("msgs").style.display="flex"};
window.addContact=()=>{let n=document.getElementById("cName").value.trim(),num=document.getElementById("cNum").value.trim();if(!n)return;contacts.push({name:n,num});localStorage.setItem("freddy_contacts",JSON.stringify(contacts));document.getElementById("cName").value="";document.getElementById("cNum").value="";renderContacts()};
function renderContacts(){let l=document.getElementById("cList");l.innerHTML="";contacts.forEach((c,i)=>{let d=document.createElement("div");d.className="contact";d.innerHTML=`<div><b>${c.name}</b><br><small>${c.num}</small></div><div><span onclick="openVideo('${c.name}')" style="background:#25D366;padding:8px 12px;border-radius:20px">📞</span> <span onclick="document.getElementById('chatName').innerText='${c.name}';hidePages()" style="background:#2a3942;padding:8px 12px;border-radius:20px">💬</span> <span onclick="contacts.splice(${i},1);localStorage.setItem('freddy_contacts',JSON.stringify(contacts));renderContacts()">🗑️</span></div>`;l.appendChild(d)})}
window.openVideo=(who)=>{document.getElementById("videoBox").style.display="flex";document.getElementById("videoTitle").innerText="📹 "+who;document.getElementById("videoFrame").src="https://meet.jit.si/FREDDY-V4-"+encodeURIComponent(who)+"-"+Date.now()};
window.send=()=>{let t=document.getElementById("text").value.trim();if(!t)return;let ytId=extractYT(t);let data={name:myName,text:t,time:Date.now()};if(ytId)data.youtube=ytId;document.getElementById("text").value="";push(ref(db,"messages"),data);set(ref(db,"typing/"+myName),{typing:false})};
function extractYT(url){let m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}
let rec,chunks=[];window.toggleRec=async()=>{let btn=document.getElementById("micBtn");try{if(!rec||rec.state=="inactive"){let stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let r=new FileReader();r.onload=()=>push(ref(db,"messages"),{name:myName,text:"🎤 Vocal",time:Date.now(),audio:r.result});r.readAsDataURL(blob)};rec.start();btn.innerText="⏹️";btn.style.background="red"}else{rec.stop();btn.innerText="🎤";btn.style.background="#25D366"}}catch(e){alert("Micro non autorisé")}}; 
function renderMsg(m){let div=document.getElementById("msgs");let isMe=m.name==myName;let el=document.createElement("div");el.className="msg "+(isMe?"me":"other");let media="";if(m.img)media=`<img src="${m.img}">`;if(m.video)media+=`<video controls src="${m.video}"></video>`;if(m.audio)media+=`<audio controls src="${m.audio}"></audio>`;if(m.youtube)media+=`<iframe width="200" height="112" src="https://www.youtube-nocookie.com/embed/${m.youtube}" frameborder="0" allow="encrypted-media;fullscreen" style="border-radius:8px;margin-top:4px"></iframe>`;el.innerHTML=`<b style="font-size:11px;color:#53bdeb">${m.name}</b><div>${(m.text||'').replace(/</g,'&lt;')}${media}</div><span style="position:absolute;bottom:2px;right:6px;font-size:10px;opacity:.7">${new Date(m.time).toLocaleTimeString().slice(0,5)} ${isMe?'✓✓':''}</span>`;div.appendChild(el);div.scrollTop=99999}
onChildAdded(ref(db,"messages"),s=>{let m=s.val();allMsgs.push(m);renderMsg(m)});
onValue(ref(db,"typing"),snap=>{let v=snap.val()||{};let txt="";for(let k in v){if(v[k].typing&&k!=myName)txt=`${v[k].name} écrit...`}document.getElementById("typing").innerText=txt});
document.getElementById("text").addEventListener("input",()=>{set(ref(db,"typing/"+myName),{typing:true,name:myName});clearTimeout(window.typTimeout);window.typTimeout=setTimeout(()=>set(ref(db,"typing/"+myName),{typing:false}),1500)});
function handleFile(f){let r=new FileReader();r.onload=()=>{if(f.type.startsWith("video"))push(ref(db,"messages"),{name:myName,text:"🎥 Vidéo",time:Date.now(),video:r.result});else push(ref(db,"messages"),{name:myName,text:"📸 Photo",time:Date.now(),img:r.result})};r.readAsDataURL(f)}
document.getElementById("img").addEventListener("change",e=>{if(e.target.files[0])handleFile(e.target.files[0])});
document.getElementById("text").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
let tempStatusImg="",tempIsVid=false;document.getElementById("sImg").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{tempStatusImg=r.result;tempIsVid=f.type.startsWith("video")};r.readAsDataURL(f)});
window.addStatus=()=>{let t=document.getElementById("sText").value.trim();if(!t&&!tempStatusImg)return;push(ref(db,"statuses"),{name:myName,text:t,img:tempIsVid?null:tempStatusImg,video:tempIsVid?tempStatusImg:null,time:Date.now()});document.getElementById("sText").value="";tempStatusImg="";tempIsVid=false};
onChildAdded(ref(db,"statuses"),s=>{let m=s.val();allStatus.push(m);if(Date.now()-m.time>86400000)return;let l=document.getElementById("sList");let d=document.createElement("div");d.className="card";d.innerHTML=`<b>${m.name}</b><br><small>${m.text||''}</small>${m.video?`<br><video controls style="width:100%;border-radius:8px;margin-top:4px" src="${m.video}"></video>`:''}${m.img?`<br><img style="width:100%;border-radius:8px;margin-top:4px" src="${m.img}">`:''}`;l.prepend(d)});
window.doSearch=(q)=>{if(!q.trim()){hidePages();return}q=q.toLowerCase();let res=document.getElementById("searchRes");res.style.display="flex";res.style.flexDirection="column";document.getElementById("msgs").style.display="none";let html=`<h3>🔍 "${q}"</h3>`;let f=0;allMsgs.forEach(m=>{if((m.text||"").toLowerCase().includes(q)){html+=`<div class="contact"><div><b>${m.name}</b>: ${m.text}</div></div>`;f++}});if(!f)html+=`<p>Aucun dans le chat. Cherche sur YouTube ou Google !</p><div style="display:flex;gap:8px"><button onclick="document.getElementById('ytSearch').value='${q}';showPage('youtube');searchYT()" style="background:red;padding:10px;border:none;border-radius:8px;color:#fff">YouTube</button><button onclick="document.getElementById('gSearch').value='${q}';showPage('google');searchG()" style="background:#4285F4;padding:10px;border:none;border-radius:8px;color:#fff">Google</button></div>`;html+=`<button onclick="hidePages()" style="margin-top:10px;padding:10px;background:#25D366;border:none;border-radius:8px">Retour</button>`;res.innerHTML=html};
window.searchYT=()=>{let q=document.getElementById("ytSearch").value.trim();if(!q)return;currentYT=q;document.getElementById("ytFrame").src="https://www.youtube-nocookie.com/embed?listType=search&list="+encodeURIComponent(q)};window.quickYT=(q)=>{document.getElementById("ytSearch").value=q;searchYT()};
window.searchG=()=>{let q=document.getElementById("gSearch").value.trim()||"RDC actualités";document.getElementById("gFrame").src="https://duckduckgo.com/?q="+encodeURIComponent(q)+"&ia=web"};
window.shareYT=()=>{if(!currentYT)return;push(ref(db,"messages"),{name:myName,text:"▶️ YouTube: "+currentYT+" https://youtube.com/results?search_query="+encodeURIComponent(currentYT),time:Date.now()});hidePages();alert("Partagé dans le chat !")};
document.getElementById("ytFrame").addEventListener("load",()=>{try{let url=document.getElementById("ytFrame").src;if(url.includes("youtube")){let id=url.split("list=")[1];}}catch{}});
</script></body></html>
