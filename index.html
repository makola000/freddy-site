<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FREDDY V5 RECHERCHE VRAIE</title><meta name="theme-color" content="#25D366"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#111b21;color:#fff;display:flex;height:100vh}aside{width:68px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column;align-items:center;padding:6px;gap:6px}aside div{width:42px;height:42px;background:#202c33;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}aside .active{background:#25D366}#main{flex:1;display:flex;flex-direction:column}header{background:#202c33;padding:6px;display:flex;gap:6px}header input{flex:1;padding:10px;border-radius:20px;border:none;background:#2a3942;color:#fff}#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.msg{max-width:80%;padding:8px 12px 18px;border-radius:8px;position:relative}.me{background:#005c4b;align-self:flex-end}.other{background:#202c33;align-self:flex-start}.overlay{position:fixed;inset:0;background:#0f0f0f;z-index:15;display:none;flex-direction:column}.head{background:#202c33;padding:10px;display:flex;gap:6px}.head input{flex:1;padding:11px;border-radius:20px;border:none;background:#2a3942;color:#fff}.full{flex:1;border:none;width:100%}.card{background:#202c33;border-radius:12px;overflow:hidden;margin:8px;cursor:pointer}.card img{width:100%;aspect-ratio:16/9;object-fit:cover}.card .info{padding:8px}.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:10px}.ytBig{padding:10px;background:#000}#form{background:#202c33;padding:6px;display:flex;gap:4px}#form input{flex:1;padding:11px;border-radius:20px;border:none;background:#2a3942;color:#fff}#form button{width:36px;height:36px;border-radius:50%;border:none;background:#25D366;color:#fff}#videoBox{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}#login{position:fixed;inset:0;background:#111b21;z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px}</style></head><body>
<aside><div onclick="showPage('chat')">💬</div><div onclick="showPage('youtube')" style="background:#FF0000">▶️</div><div onclick="showPage('google')" style="background:#4285F4">📚</div><div onclick="showPage('contacts')">📇</div><div onclick="openVideo('MONDE')">📹</div><div style="margin-top:auto;background:#25D366;font-weight:bold">F</div></aside>
<div id="main"><header><input id="search" placeholder="🔍 Rechercher dans chat..." oninput="doSearch(this.value)"></header><div style="background:#202c33;padding:4px 10px;font-size:12px"><b id="chatName">FREDDY V5</b> <span style="color:#25D366">● RECHERCHE VRAIE N°1</span> <small id="typing" style="color:#53bdeb"></small></div><div id="msgs"></div><div id="searchRes" style="display:none;flex:1;overflow:auto;padding:10px;background:#0b141a"></div><div id="form"><input id="text" type="text" placeholder="Message..."><input type="file" id="img" accept="image/*,video/*" style="display:none"><button onclick="document.getElementById('img').click()">📷</button><button id="micBtn" onclick="toggleRec()">🎤</button><button onclick="send()">➤</button></div></div>
<div id="youtube" class="overlay"><div class="head"><input id="ytSearch" placeholder="🔍 YouTube: cours maths, physique, chimie, bio..."><button onclick="searchYT()" style="background:#FF0000;color:#fff;padding:10px 18px;border-radius:20px;border:none">CHERCHER</button><button onclick="hidePages()" style="background:#333;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div><div style="padding:6px;display:flex;gap:6px;flex-wrap:wrap"><button onclick="quickYT('cours mathématiques terminale')">📐 Maths</button><button onclick="quickYT('cours physique chimie')">⚗️ Physique</button><button onclick="quickYT('cours SVT biologie')">🧬 SVT</button><button onclick="quickYT('cours informatique programmation')">💻 Info</button><button onclick="quickYT('Fally Ipupa')">🎵 Musique</button></div><div id="ytPlayerWrap" style="display:none" class="ytBig"><iframe id="ytPlayer" class="full" style="height:240px" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe><div style="padding:8px;display:flex;gap:8px"><button onclick="shareYT()" style="background:#25D366;padding:8px 14px;border-radius:20px;border:none;color:#fff">Partager dans Chat ➤</button><button onclick="document.getElementById('ytPlayerWrap').style.display='none'" style="background:red;padding:8px 14px;border-radius:20px;border:none;color:#fff">Fermer</button></div><div id="ytTitle" style="padding:8px"></div></div><div id="ytGrid" class="grid"></div><div id="ytStatus" style="padding:20px;text-align:center;opacity:.6">Tape un sujet scientifique et clique CHERCHER - Ex: théorème de Pythagore</div></div>
<div id="googlePage" class="overlay"><div class="head"><input id="gSearch" placeholder="📚 Recherche scientifique: maths, physique, tout..."><button onclick="searchG()" style="background:#4285F4;color:#fff;padding:10px 18px;border-radius:20px;border:none">CHERCHER</button><button onclick="hidePages()" style="background:#333;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div><div style="padding:6px;display:flex;gap:6px;flex-wrap:wrap"><button onclick="quickG('théorème Pythagore explication')">📐 Pythagore</button><button onclick="quickG('tableau périodique chimie')">⚗️ Chimie</button><button onclick="quickG('photosynthèse biologie cours')">🧬 Bio</button><button onclick="quickG('algorithme programmation')">💻 Algo</button></div><div id="gResults" style="flex:1;overflow:auto;padding:10px"></div><iframe id="gFrame" class="full" style="display:none"></iframe></div>
<div id="contacts" class="overlay"><div class="head"><h3 style="flex:1">📇</h3><button onclick="hidePages()" style="background:red;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div><div style="padding:10px"><div style="display:flex;gap:6px"><input id="cName" placeholder="Nom" style="flex:1;padding:10px;border-radius:8px;border:none"><input id="cNum" placeholder="Numéro" style="flex:1;padding:10px;border-radius:8px;border:none"><button onclick="addContact()" style="padding:10px;background:#25D366;border:none;border-radius:8px">+</button></div><div id="cList"></div></div></div>
<div id="videoBox"><div style="background:#202c33;padding:10px;display:flex;justify-content:space-between"><span id="videoTitle">📹</span><span onclick="document.getElementById('videoBox').style.display='none';document.getElementById('videoFrame').src=''" style="background:red;padding:6px 14px;border-radius:20px">❌</span></div><iframe id="videoFrame" allow="camera;microphone" class="full"></iframe></div>
<div id="login"><h1 style="color:#25D366">FREDDY V5 N°1 🌍</h1><p style="text-align:center">YouTube + Cours scientifiques qui MARCHENT</p><input id="name" placeholder="Ton prénom" style="padding:14px;width:100%;max-width:300px;border-radius:8px;border:none;margin:10px"><button onclick="save()" style="padding:14px;width:100%;max-width:300px;background:#25D366;border:none;border-radius:8px;color:#fff;font-weight:bold">ENTRER 🚀</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,push,onChildAdded,set,onValue}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const config={apiKey:"AIzaSyDfY6UU7H6tkhFX2BCm17haprCP-gBDmhY",authDomain:"freddy-chat-be9da.firebaseapp.com",databaseURL:"https://freddy-chat-be9da-default-rtdb.firebaseio.com",projectId:"freddy-chat-be9da",appId:"1:383693224398:web:7c1f193021bec3c962139f"};
const app=initializeApp(config);const db=getDatabase(app);
let myName=localStorage.getItem("freddy_name")||"";if(myName)document.getElementById("login").style.display="none";
window.save=()=>{let v=document.getElementById("name").value.trim();if(!v)return;myName=v;localStorage.setItem("freddy_name",v);document.getElementById("login").style.display="none"};
let contacts=JSON.parse(localStorage.getItem("freddy_contacts")||"[]");let allMsgs=[];let currentVideo=null;
window.showPage=(p)=>{hidePages();let id=p=="chat"?"main":p=="contacts"?"contacts":p=="youtube"?"youtube":p=="google"?"googlePage":"main";document.getElementById(id).style.display="flex";if(p=="contacts")renderContacts()};window.hidePages=()=>{document.querySelectorAll('.overlay').forEach(e=>e.style.display='none');document.getElementById("searchRes").style.display="none";document.getElementById("msgs").style.display="flex"};
window.addContact=()=>{let n=document.getElementById("cName").value.trim(),num=document.getElementById("cNum").value.trim();if(!n)return;contacts.push({name:n,num});localStorage.setItem("freddy_contacts",JSON.stringify(contacts));document.getElementById("cName").value="";document.getElementById("cNum").value="";renderContacts()};
function renderContacts(){let l=document.getElementById("cList");l.innerHTML="";contacts.forEach((c,i)=>{let d=document.createElement("div");d.style.cssText="background:#202c33;padding:10px;border-radius:10px;margin:6px;display:flex;justify-content:space-between";d.innerHTML=`<div><b>${c.name}</b><br><small>${c.num}</small></div><div><span onclick="openVideo('${c.name}')" style="background:#25D366;padding:8px 12px;border-radius:20px">📞</span> <span onclick="contacts.splice(${i},1);localStorage.setItem('freddy_contacts',JSON.stringify(contacts));renderContacts()">🗑️</span></div>`;l.appendChild(d)})}
window.openVideo=(who)=>{document.getElementById("videoBox").style.display="flex";document.getElementById("videoTitle").innerText="📹 "+who;document.getElementById("videoFrame").src="https://meet.jit.si/FREDDY-V5-"+encodeURIComponent(who)+"-"+Date.now()};
window.send=()=>{let t=document.getElementById("text").value.trim();if(!t)return;let data={name:myName,text:t,time:Date.now()};let ytId=t.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);if(ytId)data.youtube=ytId[1];document.getElementById("text").value="";push(ref(db,"messages"),data)};
let rec,chunks=[];window.toggleRec=async()=>{let btn=document.getElementById("micBtn");try{if(!rec||rec.state=="inactive"){let stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let r=new FileReader();r.onload=()=>push(ref(db,"messages"),{name:myName,text:"🎤 Vocal",time:Date.now(),audio:r.result});r.readAsDataURL(blob)};rec.start();btn.innerText="⏹️";btn.style.background="red"}else{rec.stop();btn.innerText="🎤";btn.style.background="#25D366"}}catch(e){alert("Micro non autorisé")}}; 
onChildAdded(ref(db,"messages"),s=>{let m=s.val();allMsgs.push(m);let div=document.getElementById("msgs");let isMe=m.name==myName;let el=document.createElement("div");el.className="msg "+(isMe?"me":"other");let media="";if(m.img)media=`<img src="${m.img}" style="max-width:200px;border-radius:8px">`;if(m.video)media+=`<video controls src="${m.video}" style="max-width:200px;border-radius:8px"></video>`;if(m.audio)media+=`<audio controls src="${m.audio}"></audio>`;if(m.youtube)media+=`<iframe width="200" height="112" src="https://www.youtube-nocookie.com/embed/${m.youtube}" frameborder="0" allowfullscreen style="border-radius:8px;margin-top:4px"></iframe>`;el.innerHTML=`<b style="font-size:11px;color:#53bdeb">${m.name}</b><div>${(m.text||'').replace(/</g,'&lt;')}${media}</div><span style="position:absolute;bottom:2px;right:6px;font-size:10px;opacity:.7">${new Date(m.time).toLocaleTimeString().slice(0,5)}</span>`;div.appendChild(el);div.scrollTop=99999});
onValue(ref(db,"typing"),snap=>{let v=snap.val()||{};let txt="";for(let k in v){if(v[k].typing&&k!=myName)txt=`${v[k].name} écrit...`}document.getElementById("typing").innerText=txt});
document.getElementById("text").addEventListener("input",()=>{set(ref(db,"typing/"+myName),{typing:true,name:myName});clearTimeout(window.typTimeout);window.typTimeout=setTimeout(()=>set(ref(db,"typing/"+myName),{typing:false}),1500)});
document.getElementById("img").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{if(f.type.startsWith("video"))push(ref(db,"messages"),{name:myName,text:"🎥 Vidéo",time:Date.now(),video:r.result});else push(ref(db,"messages"),{name:myName,text:"📸 Photo",time:Date.now(),img:r.result})};r.readAsDataURL(f)});
document.getElementById("text").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
window.doSearch=(q)=>{if(!q.trim()){hidePages();return}q=q.toLowerCase();let res=document.getElementById("searchRes");res.style.display="flex";res.style.flexDirection="column";document.getElementById("msgs").style.display="none";let html=`<h3>🔍 "${q}"</h3>`;let f=0;allMsgs.forEach(m=>{if((m.text||"").toLowerCase().includes(q)){html+=`<div style="background:#202c33;padding:8px;border-radius:8px;margin:4px"><b>${m.name}</b>: ${m.text}</div>`;f++}});if(!f)html+=`<p>Rien dans le chat. Essaie YouTube ou Cours !</p>`;html+=`<button onclick="hidePages()" style="margin-top:10px;padding:10px;background:#25D366;border:none;border-radius:8px">Retour</button>`;res.innerHTML=html};

// YOUTUBE RECHERCHE VRAIE - utilise Piped API (ne bloque pas)
window.searchYT=async()=>{
 let q=document.getElementById("ytSearch").value.trim();if(!q)return;
 let grid=document.getElementById("ytGrid");let status=document.getElementById("ytStatus");
 status.innerText="🔍 Recherche '"+q+"'...";status.style.display="block";grid.innerHTML="";
 try{
  let res=await fetch("https://pipedapi.kavin.rocks/search?q="+encodeURIComponent(q)+"&filter=videos");
  let data=await res.json();
  status.style.display="none";
  if(!data.items||data.items.length==0){status.innerText="Aucun résultat";status.style.display="block";return}
  data.items.slice(0,12).forEach(v=>{
   let d=document.createElement("div");d.className="card";
   d.innerHTML=`<img src="${v.thumbnail}"><div class="info"><b>${v.title.slice(0,50)}</b><br><small>${v.uploaderName||''} • ${v.views?Math.round(v.views/1000)+'k vues':''}</small></div>`;
   d.onclick=()=>{currentVideo=v;document.getElementById("ytPlayerWrap").style.display="block";document.getElementById("ytPlayer").src="https://www.youtube-nocookie.com/embed/"+v.url.split("v=")[1].split("&")[0];document.getElementById("ytTitle").innerText=v.title;window.scrollTo(0,0)};
   grid.appendChild(d);
  });
 }catch(e){
  status.innerHTML="Erreur réseau, on essaie un autre serveur..."; 
  try{
   let res2=await fetch("https://pipedapi.adminforge.de/search?q="+encodeURIComponent(q)+"&filter=videos");
   let data2=await res2.json();
   status.style.display="none";data2.items.slice(0,12).forEach(v=>{
    let d=document.createElement("div");d.className="card";d.innerHTML=`<img src="${v.thumbnail}"><div class="info"><b>${v.title.slice(0,50)}</b></div>`;
    d.onclick=()=>{currentVideo=v;document.getElementById("ytPlayerWrap").style.display="block";document.getElementById("ytPlayer").src="https://www.youtube-nocookie.com/embed/"+v.url.split("?v=")[1];document.getElementById("ytTitle").innerText=v.title};
    grid.appendChild(d);
   });
  }catch{status.innerText="❌ Réessaie avec un autre mot"; }
 }
};
window.quickYT=(q)=>{document.getElementById("ytSearch").value=q;searchYT()};
window.shareYT=()=>{if(!currentVideo)return;push(ref(db,"messages"),{name:myName,text:"▶️ "+currentVideo.title+" https://youtube.com/watch?v="+currentVideo.url.split("v=")[1].split("&")[0],time:Date.now(),youtube:currentVideo.url.split("v=")[1].split("&")[0]});hidePages();alert("Vidéo partagée dans le chat !")};

// RECHERCHE SCIENTIFIQUE VRAIE - utilise Wikipedia + DuckDuckGo
window.searchG=async()=>{
 let q=document.getElementById("gSearch").value.trim();if(!q)return;
 let out=document.getElementById("gResults");out.innerHTML="🔍 Recherche scientifique '"+q+"'...";
 try{
  let wiki=await fetch("https://fr.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q)).then(r=>r.json()).catch(()=>null);
  let html="";
  if(wiki&&wiki.extract){html+=`<div class="card" style="padding:12px"><h3>📚 ${wiki.title}</h3><p>${wiki.extract}</p>${wiki.thumbnail?`<img src="${wiki.thumbnail.source}" style="max-width:200px;border-radius:8px">`:''}<br><a href="${wiki.content_urls?.desktop?.page}" target="_blank" style="color:#53bdeb">Voir sur Wikipedia</a> <button onclick="shareCourse('${wiki.title}')" style="background:#25D366;border:none;padding:6px 12px;border-radius:20px;color:#fff;margin-left:8px">Partager</button></div>`}
  let duck=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&pretty=0").then(r=>r.json()).catch(()=>null);
  if(duck&&duck.AbstractText){html+=`<div class="card" style="padding:12px"><h3>🔬 ${duck.Heading||q}</h3><p>${duck.AbstractText}</p>${duck.Image?`<img src="${duck.Image}" style="max-width:200px">`:''}<br><small>Source: ${duck.AbstractURL}</small></div>`}
  if(!html)html=`<div style="padding:20px">Pas de résumé direct. <br><br><a href="https://fr.wikipedia.org/wiki/${encodeURIComponent(q)}" target="_blank" style="color:#53bdeb;background:#202c33;padding:10px;border-radius:8px;display:inline-block">📚 Voir sur Wikipedia: ${q}</a><br><br><a href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank" style="color:#fff;background:#4285F4;padding:10px;border-radius:8px;display:inline-block">🔍 Voir sur Google: ${q}</a><br><br><button onclick="shareCourse('${q}')" style="background:#25D366;padding:10px;border:none;border-radius:8px;color:#fff">Partager ce sujet dans le chat</button></div>`;
  out.innerHTML=html;
 }catch(e){out.innerHTML=`<div style="padding:20px">Erreur. Ouvre direct:<br><a href="https://fr.wikipedia.org/wiki/${encodeURIComponent(q)}" target="_blank" style="color:#53bdeb">Wikipedia: ${q}</a><br><a href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank" style="color:#4285F4">Google: ${q}</a></div>`}
};
window.quickG=(q)=>{document.getElementById("gSearch").value=q;searchG()};
window.shareCourse=(t)=>{push(ref(db,"messages"),{name:myName,text:"📚 Cours: "+t+" - https://fr.wikipedia.org/wiki/"+encodeURIComponent(t),time:Date.now()});hidePages();alert("Cours partagé !")};
</script></body></html>
