<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FREDDY V10 SAUVEGARDE</title><meta name="theme-color" content="#25D366"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#111b21;color:#fff;display:flex;height:100vh}aside{width:70px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px}aside div{width:44px;height:44px;background:#202c33;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}aside .yt{background:#FF0000}#main{flex:1;display:flex;flex-direction:column}header{background:#202c33;padding:8px;display:flex;gap:6px}header input{flex:1;padding:10px;border-radius:20px;border:none;background:#2a3942;color:#fff}#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.msg{max-width:85%;padding:8px 12px 16px;border-radius:8px;position:relative;font-size:14px;word-break:break-word}.me{background:#005c4b;align-self:flex-end}.other{background:#202c33;align-self:flex-start}.overlay{position:fixed;inset:0;background:#0f0f0f;z-index:10;display:none;flex-direction:column}.head{background:#202c33;padding:10px;display:flex;gap:6px}.head input{flex:1;padding:12px;border-radius:20px;border:none;background:#2a3942;color:#fff}.grid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.card{background:#202c33;border-radius:12px;overflow:hidden;cursor:pointer}.card img{width:100%;aspect-ratio:16/9;object-fit:cover}.card .info{padding:8px;font-size:13px}.quick{display:flex;gap:6px;padding:8px;flex-wrap:wrap}.quick button{padding:6px 12px;border-radius:20px;border:none;background:#202c33;color:#fff}iframe{border:none;width:100%}.playerWrap{background:#000;padding:10px;display:none}#form{background:#202c33;padding:6px;display:flex;gap:4px}#form input{flex:1;padding:11px;border-radius:20px;border:none;background:#2a3942;color:#fff}#form button{width:38px;height:38px;border-radius:50%;border:none;background:#25D366;color:#fff}#login{position:fixed;inset:0;background:#111b21;z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px}#videoBox{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}</style></head><body>
<aside><div onclick="showPage('chat')">💬</div><div onclick="showPage('youtube')" class="yt">▶️</div><div onclick="showPage('google')" style="background:#4285F4">📚</div><div onclick="showPage('contacts')">📇</div><div onclick="openCall()">📹</div><div style="margin-top:auto;background:#25D366;font-weight:bold">F</div></aside>
<div id="main"><header><input id="search" placeholder="🔍 Chercher..." oninput="doSearch(this.value)"><button onclick="exportChat()" style="background:#202c33;border:none;color:#fff;padding:6px 10px;border-radius:20px">💾</button></header><div style="background:#202c33;padding:6px 10px;font-size:12px"><b>FREDDY V10 - SAUVEGARDE LOCALE</b> <small id="typing" style="color:#53bdeb"></small> <small id="msgCount" style="float:right"></small></div><div id="msgs"></div><div id="searchRes" style="display:none;flex:1;overflow:auto;padding:10px;background:#0b141a"></div><div id="form"><input id="text" type="text" placeholder="Message..."><input type="file" id="file" accept="image/*,video/*" style="display:none"><button onclick="document.getElementById('file').click()">📷</button><button id="mic" onclick="recVoice()">🎤</button><button onclick="send()">➤</button></div></div>

<div id="youtube" class="overlay">
<div class="head"><input id="ytSearch" placeholder="🔍 YouTube..."><button onclick="searchYT()" style="background:#FF0000;color:#fff;padding:10px 18px;border-radius:20px;border:none">CHERCHER</button><button onclick="hidePages()" style="background:#333;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div>
<div class="quick"><button onclick="quickYT('cours mathématiques')">📐 Maths</button><button onclick="quickYT('physique')">⚗️ Physique</button><button onclick="quickYT('informatique')">💻 Info</button></div>
<div id="ytPlayerWrap" class="playerWrap"><iframe id="ytPlayer" height="220" allowfullscreen allow="autoplay; encrypted-media"></iframe><div style="padding:8px;display:flex;gap:8px"><button onclick="shareYT()" style="background:#25D366;padding:8px 14px;border-radius:20px;border:none;color:#fff">Partager ➤</button><button onclick="document.getElementById('ytPlayerWrap').style.display='none'" style="background:red;padding:8px 14px;border-radius:20px;border:none;color:#fff">Fermer</button></div><div id="ytTitle"></div></div>
<div id="ytGrid" class="grid"></div><div id="ytStatus" style="padding:20px;text-align:center;opacity:.6">Tape et CHERCHER</div>
</div>

<div id="googlePage" class="overlay"><div class="head"><input id="gSearch" placeholder="📚 Cours..."><button onclick="searchG()" style="background:#4285F4;color:#fff;padding:10px 18px;border-radius:20px;border:none">CHERCHER</button><button onclick="hidePages()" style="background:#333;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div><div id="gResults" style="flex:1;overflow:auto;padding:10px"></div></div>
<div id="contacts" class="overlay"><div class="head"><h3 style="flex:1">📇 Contacts</h3><button onclick="hidePages()" style="background:red;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div><div style="padding:10px"><div style="display:flex;gap:6px"><input id="cName" placeholder="Nom" style="flex:1;padding:10px;border-radius:8px;border:none"><input id="cNum" placeholder="Numéro" style="flex:1;padding:10px;border-radius:8px;border:none"><button onclick="addContact()" style="padding:10px;background:#25D366;border:none;border-radius:8px">+</button></div><div id="cList"></div></div></div>
<div id="videoBox"><div style="background:#202c33;padding:10px;display:flex;justify-content:space-between"><span id="vTitle">📹 Appel</span><span onclick="document.getElementById('videoBox').style.display='none';document.getElementById('vFrame').src=''" style="background:red;padding:6px 14px;border-radius:20px">❌</span></div><iframe id="vFrame" allow="camera;microphone" style="flex:1;border:none"></iframe></div>
<div id="login"><h1 style="color:#25D366">FREDDY V10</h1><p>Sauvegarde locale - plus de perte</p><input id="myName" placeholder="Ton prénom" style="padding:14px;width:100%;max-width:300px;border-radius:8px;border:none;margin:10px"><button onclick="saveName()" style="padding:14px;width:100%;max-width:300px;background:#25D366;border:none;border-radius:8px;color:#fff;font-weight:bold">ENTRER 🚀</button><p id="restoreInfo" style="font-size:12px;margin-top:15px;opacity:.6"></p></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,push,onChildAdded,onValue,set,query,orderByChild,limitToLast}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={apiKey:"AIzaSyDfY6UU7H6tkhFX2BCm17haprCP-gBDmhY",authDomain:"freddy-chat-be9da.firebaseapp.com",databaseURL:"https://freddy-chat-be9da-default-rtdb.firebaseio.com",projectId:"freddy-chat-be9da",appId:"1:383693224398:web:7c1f193021bec3c962139f"};
const app=initializeApp(cfg);const db=getDatabase(app);
let me=localStorage.getItem("freddy_name")||"";if(me)document.getElementById("login").style.display="none";
window.saveName=()=>{let v=document.getElementById("myName").value.trim();if(!v)return;me=v;localStorage.setItem("freddy_name",v);document.getElementById("login").style.display="none"};
let contacts=JSON.parse(localStorage.getItem("freddy_contacts")||"[]");
let allMsgs=JSON.parse(localStorage.getItem("freddy_backup")||"[]"); // RESTAURE LOCAL
let currentVideo=null;

function saveLocal(){localStorage.setItem("freddy_backup",JSON.stringify(allMsgs.slice(-300)));document.getElementById("msgCount").innerText=allMsgs.length+" sauvegardés";document.getElementById("restoreInfo").innerText=allMsgs.length+" messages sauvegardés localement"}
function renderAll(){document.getElementById("msgs").innerHTML="";allMsgs.forEach(m=>renderOne(m,true))}
function renderOne(m,isRestore=false){
 let d=document.getElementById("msgs");let isMe=m.name==me;
 let el=document.createElement("div");el.className="msg "+(isMe?"me":"other");
 let media="";
 if(m.img)media+=`<img src="${m.img}" style="max-width:200px;border-radius:8px;display:block;margin-top:6px" onclick="window.open(this.src)">`;
 if(m.video)media+=`<video controls src="${m.video}" style="max-width:200px;border-radius:8px;display:block;margin-top:6px"></video>`;
 if(m.audio)media+=`<audio controls src="${m.audio}" style="max-width:200px;display:block;margin-top:6px"></audio>`;
 if(m.youtube)media+=`<iframe width="200" height="112" src="https://www.youtube-nocookie.com/embed/${m.youtube}" frameborder="0" allowfullscreen style="border-radius:8px;margin-top:6px"></iframe>`;
 let text=(m.text||'').replace(/</g,'&lt;').replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" style="color:#53bdeb">$1</a>');
 el.innerHTML=`<b style="font-size:11px;color:#53bdeb">${m.name}</b><div>${text}${media}</div><span style="position:absolute;bottom:2px;right:6px;font-size:10px;opacity:.6">${new Date(m.time).toLocaleTimeString().slice(0,5)}</span>`;
 d.appendChild(el);if(!isRestore)d.scrollTop=d.scrollHeight;
}
renderAll();saveLocal();

// Firebase - ajoute les nouveaux
let msgsRef=query(ref(db,"messages"),orderByChild("time"),limitToLast(200));
onChildAdded(msgsRef,s=>{
 let m=s.val();
 if(allMsgs.find(x=>x.time==m.time&&x.name==m.name))return; // évite doublons
 allMsgs.push(m);renderOne(m);saveLocal();
});

window.showPage=(p)=>{hidePages();document.getElementById(p=="chat"?"main":p=="youtube"?"youtube":p=="google"?"googlePage":p=="contacts"?"contacts":"main").style.display="flex";if(p=="contacts")renderC()};
window.hidePages=()=>{document.querySelectorAll('.overlay').forEach(e=>e.style.display='none');document.getElementById("searchRes").style.display="none";document.getElementById("msgs").style.display="flex"};
window.addContact=()=>{let n=document.getElementById("cName").value.trim(),num=document.getElementById("cNum").value.trim();if(!n)return;contacts.push({name:n,num});localStorage.setItem("freddy_contacts",JSON.stringify(contacts));document.getElementById("cName").value="";document.getElementById("cNum").value="";renderC()};
function renderC(){let l=document.getElementById("cList");l.innerHTML="";contacts.forEach((c,i)=>{let d=document.createElement("div");d.style.cssText="background:#202c33;padding:10px;border-radius:10px;margin:6px;display:flex;justify-content:space-between";d.innerHTML=`<div><b>${c.name}</b><br><small>${c.num}</small></div><div><span onclick="openCall('${c.name}')" style="background:#25D366;padding:8px 12px;border-radius:20px">📞</span> <span onclick="contacts.splice(${i},1);localStorage.setItem('freddy_contacts',JSON.stringify(contacts));renderC()">🗑️</span></div>`;l.appendChild(d)})}
window.openCall=(who="MONDE")=>{document.getElementById("videoBox").style.display="flex";document.getElementById("vTitle").innerText="📹 "+who;document.getElementById("vFrame").src="https://meet.jit.si/FREDDY-"+encodeURIComponent(who)+"-"+Date.now()};
window.send=()=>{
 let t=document.getElementById("text").value.trim();if(!t)return;document.getElementById("text").value="";
 let msg={name:me,text:t,time:Date.now()};
 allMsgs.push(msg);renderOne(msg);saveLocal(); // sauve local immédiatement
 push(ref(db,"messages"),msg);set(ref(db,"typing/"+me),{typing:false});
};
let rec,chunks=[];window.recVoice=async()=>{let b=document.getElementById("mic");try{if(!rec||rec.state=="inactive"){let s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let r=new FileReader();r.onload=()=>{let mm={name:me,text:"🎤 Vocal",time:Date.now(),audio:r.result};allMsgs.push(mm);renderOne(mm);saveLocal();push(ref(db,"messages"),mm)};r.readAsDataURL(blob)};rec.start();b.innerText="⏹️";b.style.background="red"}else{rec.stop();b.innerText="🎤";b.style.background="#25D366"}}catch{alert("Micro bloqué")}};
onValue(ref(db,"typing"),snap=>{let v=snap.val()||{};let txt="";for(let k in v){if(v[k].typing&&k!=me)txt=`${v[k].name} écrit...`}document.getElementById("typing").innerText=txt});
document.getElementById("text").addEventListener("input",()=>{set(ref(db,"typing/"+me),{typing:true,name:me});clearTimeout(window.tt);window.tt=setTimeout(()=>set(ref(db,"typing/"+me),{typing:false}),1500)});
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;if(f.size>1.5*1024*1024){alert("Photo trop lourde - max 1.5Mo, réduis la qualité");return}let r=new FileReader();r.onload=()=>{let mm={name:me,time:Date.now(),img:f.type.startsWith("video")?null:r.result,video:f.type.startsWith("video")?r.result:null,text:f.type.startsWith("video")?"🎥 Vidéo":"📸 Photo"};if(f.type.startsWith("video")){mm.video=r.result;mm.img=null}else{mm.img=r.result;mm.video=null}allMsgs.push(mm);renderOne(mm);saveLocal();push(ref(db,"messages"),mm)};r.readAsDataURL(f)});
document.getElementById("text").addEventListener("keydown",e=>{if(e.key=="Enter")send()});
window.doSearch=(q)=>{if(!q.trim()){hidePages();return}q=q.toLowerCase();let res=document.getElementById("searchRes");res.style.display="flex";res.style.flexDirection="column";document.getElementById("msgs").style.display="none";let h=`<h3>🔍 "${q}"</h3>`;let f=0;allMsgs.forEach(m=>{if((m.text||"").toLowerCase().includes(q)){h+=`<div style="background:#202c33;padding:8px;border-radius:8px;margin:4px"><b>${m.name}</b>: ${m.text.slice(0,80)}</div>`;f++}});h+=`<button onclick="hidePages()" style="margin-top:10px;padding:10px;background:#25D366;border:none;border-radius:8px">${f} trouvés - Retour</button>`;res.innerHTML=h};
window.exportChat=()=>{let data=JSON.stringify(allMsgs);let blob=new Blob([data],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download="freddy-sauvegarde.json";a.click();alert("Sauvegarde téléchargée !")};

// YOUTUBE
window.searchYT=async()=>{
 let q=document.getElementById("ytSearch").value.trim();if(!q)return;
 let grid=document.getElementById("ytGrid");let status=document.getElementById("ytStatus");
 status.innerText="🔍 Recherche '"+q+"'...";grid.innerHTML="";
 try{
  let res=await fetch("https://pipedapi.kavin.rocks/search?q="+encodeURIComponent(q)+"&filter=videos");
  let data=await res.json();
  status.style.display="none";
  data.items.slice(0,12).forEach(v=>{
   let vid=v.url.split("v=")[1]?.split("&")[0]||v.url.split("/").pop();
   let d=document.createElement("div");d.className="card";
   d.innerHTML=`<img src="${v.thumbnail}"><div class="info"><b>${v.title.slice(0,45)}</b></div>`;
   d.onclick=()=>{currentVideo={id:vid,title:v.title};document.getElementById("ytPlayerWrap").style.display="block";document.getElementById("ytPlayer").src="https://www.youtube-nocookie.com/embed/"+vid;document.getElementById("ytTitle").innerText=v.title};
   grid.appendChild(d);
  });
 }catch{status.innerHTML=`❌ Ouvre: <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" style="color:red">YouTube</a>`}
};
window.quickYT=(q)=>{document.getElementById("ytSearch").value=q;searchYT()};
window.shareYT=()=>{if(!currentVideo)return;let mm={name:me,text:"▶️ "+currentVideo.title,time:Date.now(),youtube:currentVideo.id};allMsgs.push(mm);renderOne(mm);saveLocal();push(ref(db,"messages"),mm);hidePages()};
window.searchG=async()=>{
 let q=document.getElementById("gSearch").value.trim();if(!q)return;
 let out=document.getElementById("gResults");out.innerHTML="🔍 Recherche...";
 try{
  let wiki=await fetch("https://fr.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q)).then(r=>r.json()).catch(()=>null);
  let html=wiki&&wiki.extract?`<div class="card" style="padding:12px"><h3>📚 ${wiki.title}</h3><p>${wiki.extract}</p><br><button onclick="shareCourse('${wiki.title.replace(/'/g," ")}')" style="background:#25D366;border:none;padding:8px 14px;border-radius:20px;color:#fff">Partager</button></div>`:`<div style="padding:20px"><a href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank">🔍 Google: ${q}</a></div>`;
  out.innerHTML=html;
 }catch{out.innerHTML=`<a href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank">Google</a>`}
};
window.quickG=(q)=>{document.getElementById("gSearch").value=q;searchG()};
window.shareCourse=(t)=>{let mm={name:me,text:"📚 "+t,time:Date.now()};allMsgs.push(mm);renderOne(mm);saveLocal();push(ref(db,"messages"),mm);hidePages()};
</script></body></html>
