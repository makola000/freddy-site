<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FREDDY V3 - VIDÉOS</title><link rel="manifest" href='data:application/json;base64,[STRIPPED]'><meta name="theme-color" content="#25D366"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#111b21;color:#fff;display:flex;height:100vh}aside{width:75px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px}aside div{width:44px;height:44px;background:#202c33;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}#main{flex:1;display:flex;flex-direction:column}header{background:#202c33;padding:8px;display:flex;gap:8px;align-items:center}header input{flex:1;padding:10px;border-radius:20px;border:none;background:#2a3942;color:#fff}#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.msg{max-width:80%;padding:8px 12px 18px;border-radius:8px;position:relative}.me{background:#005c4b;align-self:flex-end}.other{background:#202c33;align-self:flex-start}.time{position:absolute;bottom:2px;right:6px;font-size:10px;opacity:.7}.msg img,.msg video{max-width:210px;border-radius:8px;display:block;margin-top:4px}.msg audio{max-width:200px;margin-top:5px}#form{background:#202c33;padding:6px;display:flex;gap:4px;align-items:center}#form input[type=text]{flex:1;padding:11px;border-radius:20px;border:none;background:#2a3942;color:#fff}#form button{width:38px;height:38px;border-radius:50%;border:none;background:#25D366;color:#fff;cursor:pointer;font-size:16px}.overlay{position:fixed;inset:0;background:#111b21;z-index:15;display:none;flex-direction:column;padding:15px;overflow:auto}.contact,.result{background:#202c33;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}.status{background:#202c33;padding:10px;border-radius:12px;margin:8px 0;display:flex;gap:10px;align-items:center}.status img,.status video{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #25D366}#videoBox{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}#videoBox iframe{flex:1;border:none}#login{position:fixed;inset:0;background:#111b21;z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px}</style></head><body>
<aside><div onclick="showPage('contacts')">📇</div><div onclick="showPage('status')">🎥</div><div onclick="showPage('chat')">💬</div><div onclick="openVideo('MONDE')">📹</div><div style="margin-top:auto;background:#25D366;font-weight:bold">F</div></aside>
<div id="main"><header><input id="search" placeholder="🔍 Rechercher messages, contacts, statuts..." oninput="doSearch(this.value)"><span onclick="openVideo(chatName.innerText)" style="background:#25D366;padding:6px 12px;border-radius:20px;cursor:pointer">📹</span></header><div style="background:#202c33;padding:6px 10px;font-size:12px;display:flex;justify-content:space-between"><b id="chatName">FREDDY V3 VIDÉO</b><span style="color:#25D366">● N°1 MONDIAL</span><small id="typing" style="color:#53bdeb"></small></div><div id="msgs"></div><div id="searchRes" style="display:none;flex:1;overflow:auto;padding:10px;background:#0b141a"></div><div id="form"><input id="text" type="text" placeholder="Message..."><input type="file" id="img" accept="image/*,video/*" style="display:none"><button onclick="document.getElementById('img').click()">📷</button><button onclick="document.getElementById('vidFile').click()" style="background:#8a2be2">🎥</button><input type="file" id="vidFile" accept="video/*" style="display:none"><button id="micBtn" onclick="toggleRec()">🎤</button><button onclick="send()">➤</button></div></div>
<div id="contacts" class="overlay"><h2>📇 Contacts <span onclick="hidePages()" style="float:right;background:red;padding:6px 12px;border-radius:20px">❌</span></h2><div style="display:flex;gap:6px;margin:12px 0"><input id="cName" placeholder="Nom" style="flex:1;padding:12px;border-radius:8px;border:none"><input id="cNum" placeholder="Numéro" style="flex:1;padding:12px;border-radius:8px;border:none"><button onclick="addContact()" style="padding:12px;background:#25D366;border:none;border-radius:8px">+</button></div><div id="cList"></div></div>
<div id="statusPage" class="overlay"><h2>🎥 Vidéos & Statuts <span onclick="hidePages()" style="float:right;background:red;padding:6px 12px;border-radius:20px">❌</span></h2><div style="display:flex;gap:6px;margin:12px 0;flex-wrap:wrap"><input id="sText" placeholder="Quoi de neuf ?" style="flex:1;padding:12px;border-radius:8px;border:none"><input type="file" id="sImg" accept="image/*,video/*" style="display:none"><button onclick="document.getElementById('sImg').click()" style="padding:12px;background:#2a3942;border:none;border-radius:8px">📷🎥</button><button onclick="addStatus()" style="padding:12px;background:#25D366;border:none;border-radius:8px">Poster</button></div><div id="sList"></div></div>
<div id="videoBox"><div style="background:#202c33;padding:10px;display:flex;justify-content:space-between"><span id="videoTitle">📹</span><span onclick="document.getElementById('videoBox').style.display='none';document.getElementById('videoFrame').src=''" style="background:red;padding:6px 14px;border-radius:20px">❌</span></div><iframe id="videoFrame" allow="camera;microphone"></iframe></div>
<div id="login"><h1 style="color:#25D366">FREDDY V3 🎥 N°1</h1><p>Vidéos + Recherche - N°1 Mondial</p><input id="name" placeholder="Ton prénom" style="padding:14px;width:100%;max-width:300px;border-radius:8px;border:none;margin:10px"><button onclick="save()" style="padding:14px;width:100%;max-width:300px;background:#25D366;border:none;border-radius:8px;color:#fff;font-weight:bold">ENTRER 🚀</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,push,onChildAdded,set,onValue}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const config={apiKey:"AIzaSyDfY6UU7H6tkhFX2BCm17haprCP-gBDmhY",authDomain:"freddy-chat-be9da.firebaseapp.com",databaseURL:"https://freddy-chat-be9da-default-rtdb.firebaseio.com",projectId:"freddy-chat-be9da",appId:"1:383693224398:web:7c1f193021bec3c962139f"};
const app=initializeApp(config);const db=getDatabase(app);
let myName=localStorage.getItem("freddy_name")||"";if(myName)document.getElementById("login").style.display="none";
window.save=()=>{let v=document.getElementById("name").value.trim();if(!v)return;myName=v;localStorage.setItem("freddy_name",v);document.getElementById("login").style.display="none"};
let contacts=JSON.parse(localStorage.getItem("freddy_contacts")||"[]");let allMsgs=[],allStatus=[];
window.showPage=(p)=>{hidePages();if(p=='contacts'){document.getElementById("contacts").style.display="flex";renderContacts()} if(p=='status'){document.getElementById("statusPage").style.display="flex"} if(p=='chat'){}};window.hidePages=()=>{document.getElementById("contacts").style.display="none";document.getElementById("statusPage").style.display="none";document.getElementById("searchRes").style.display="none";document.getElementById("msgs").style.display="flex"};
window.addContact=()=>{let n=document.getElementById("cName").value.trim(),num=document.getElementById("cNum").value.trim();if(!n)return;contacts.push({name:n,num});localStorage.setItem("freddy_contacts",JSON.stringify(contacts));document.getElementById("cName").value="";document.getElementById("cNum").value="";renderContacts()};
function renderContacts(){let l=document.getElementById("cList");l.innerHTML="";contacts.forEach((c,i)=>{let d=document.createElement("div");d.className="contact";d.innerHTML=`<div><b>${c.name}</b><br><small>${c.num}</small></div><div><span onclick="callContact('${c.name}')" style="background:#25D366;padding:8px 12px;border-radius:20px;cursor:pointer">📞</span> <span onclick="chatContact('${c.name}')" style="background:#2a3942;padding:8px 12px;border-radius:20px;cursor:pointer">💬</span> <span onclick="contacts.splice(${i},1);localStorage.setItem('freddy_contacts',JSON.stringify(contacts));renderContacts()" style="cursor:pointer">🗑️</span></div>`;l.appendChild(d)})}
window.callContact=n=>{openVideo(n)};window.chatContact=n=>{document.getElementById("chatName").innerText=n;hidePages()};
window.openVideo=(who)=>{document.getElementById("videoBox").style.display="flex";document.getElementById("videoTitle").innerText="📹 "+who;document.getElementById("videoFrame").src="https://meet.jit.si/FREDDY-V3-"+encodeURIComponent(who)+"-"+Date.now()};
window.send=()=>{let t=document.getElementById("text").value.trim();if(!t)return;document.getElementById("text").value="";push(ref(db,"messages"),{name:myName,to:document.getElementById("chatName").innerText,text:t,time:Date.now()});set(ref(db,"typing/"+myName),{typing:false})};
let rec,chunks=[];window.toggleRec=async()=>{let btn=document.getElementById("micBtn");try{if(!rec||rec.state=="inactive"){let stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let r=new FileReader();r.onload=()=>push(ref(db,"messages"),{name:myName,text:"🎤 Vocal",time:Date.now(),audio:r.result});r.readAsDataURL(blob)};rec.start();btn.innerText="⏹️";btn.style.background="red"}else{rec.stop();btn.innerText="🎤";btn.style.background="#25D366"}}catch(e){alert("Micro non autorisé")}}; 
onChildAdded(ref(db,"messages"),s=>{let m=s.val();allMsgs.push(m);let div=document.getElementById("msgs");let isMe=m.name==myName;let el=document.createElement("div");el.className="msg "+(isMe?"me":"other");let media="";if(m.img){if(m.img.startsWith("data:video"))media=`<video controls src="${m.img}"></video>`;else media=`<img src="${m.img}">`} if(m.audio)media+=`<audio controls src="${m.audio}"></audio>`; if(m.video)media+=`<video controls src="${m.video}"></video>`; el.innerHTML=`<b style="font-size:11px;color:#53bdeb">${m.name}${m.to?' → '+m.to:''}</b><div>${m.text||''}${media}</div><span class="time">${new Date(m.time).toLocaleTimeString().slice(0,5)} ${isMe?'✓✓':''}</span>`;div.appendChild(el);div.scrollTop=99999});
document.getElementById("text").addEventListener("input",()=>{set(ref(db,"typing/"+myName),{typing:true,name:myName});clearTimeout(window.typTimeout);window.typTimeout=setTimeout(()=>set(ref(db,"typing/"+myName),{typing:false}),1500)});
onValue(ref(db,"typing"),snap=>{let v=snap.val()||{};let txt="";for(let k in v){if(v[k].typing&&k!=myName)txt=`${v[k].name} écrit...`}document.getElementById("typing").innerText=txt});
function handleFile(input,isStatus){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{if(isStatus){tempStatusImg=r.result;tempStatusIsVideo=f.type.startsWith("video")}else{if(f.type.startsWith("video"))push(ref(db,"messages"),{name:myName,text:"🎥 Vidéo",time:Date.now(),video:r.result});else push(ref(db,"messages"),{name:myName,text:"📸 Photo",time:Date.now(),img:r.result})}};r.readAsDataURL(f)}
document.getElementById("img").addEventListener("change",e=>handleFile(e.target,false));document.getElementById("vidFile").addEventListener("change",e=>handleFile(e.target,false));
document.getElementById("text").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
let tempStatusImg="",tempStatusIsVideo=false;document.getElementById("sImg").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{tempStatusImg=r.result;tempStatusIsVideo=f.type.startsWith("video")};r.readAsDataURL(f)});
window.addStatus=()=>{let t=document.getElementById("sText").value.trim();if(!t&&!tempStatusImg)return;push(ref(db,"statuses"),{name:myName,text:t,img:tempStatusIsVideo?null:tempStatusImg,video:tempStatusIsVideo?tempStatusImg:null,time:Date.now()});document.getElementById("sText").value="";tempStatusImg="";tempStatusIsVideo=false};
onChildAdded(ref(db,"statuses"),s=>{let m=s.val();allStatus.push(m);if(Date.now()-m.time>86400000)return;let l=document.getElementById("sList");let d=document.createElement("div");d.className="status";let thumb=m.video?`<video src="${m.video}"></video>`:m.img?`<img src="${m.img}">`:`<div style="width:50px;height:50px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center">${m.name[0]}</div>`;d.innerHTML=`${thumb}<div><b>${m.name}</b><br><small>${m.text||''} • ${new Date(m.time).toLocaleTimeString().slice(0,5)}</small>${m.video?`<br><video controls style="width:150px;border-radius:8px;margin-top:4px" src="${m.video}"></video>`:''}${m.img?`<br><img style="width:100px;border-radius:8px;margin-top:4px" src="${m.img}">`:''}</div>`;l.prepend(d)});
window.doSearch=(q)=>{if(!q.trim()){hidePages();return}q=q.toLowerCase();let res=document.getElementById("searchRes");res.style.display="flex";res.style.flexDirection="column";document.getElementById("msgs").style.display="none";let html=`<h3>🔍 Résultats pour "${q}"</h3>`;let found=0;allMsgs.forEach(m=>{if((m.text||"").toLowerCase().includes(q)||(m.name||"").toLowerCase().includes(q)){html+=`<div class="result"><div><b>${m.name}</b>: ${m.text||''}</div><small>${new Date(m.time).toLocaleString()}</small></div>`;found++}});contacts.forEach(c=>{if(c.name.toLowerCase().includes(q)||c.num.includes(q)){html+=`<div class="result"><div>📇 <b>${c.name}</b> - ${c.num}</div></div>`;found++}});allStatus.forEach(s=>{if((s.text||"").toLowerCase().includes(q)||(s.name||"").toLowerCase().includes(q)){html+=`<div class="result"><div>🎥 ${s.name}: ${s.text||''}</div></div>`;found++}});if(found==0)html+=`<p>Aucun résultat</p>`;html+=`<button onclick="hidePages()" style="margin-top:15px;padding:12px;background:#25D366;border:none;border-radius:8px">Retour</button>`;res.innerHTML=html};
</script></body></html>
