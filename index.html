<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FREDDY FINAL FIX</title><meta name="theme-color" content="#25D366"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#111b21;color:#fff;display:flex;height:100vh}aside{width:70px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px}aside div{width:44px;height:44px;background:#202c33;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}aside .yt{background:#FF0000}#main{flex:1;display:flex;flex-direction:column}header{background:#202c33;padding:8px;display:flex;gap:6px}header input{flex:1;padding:10px;border-radius:20px;border:none;background:#2a3942;color:#fff}#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.msg{max-width:85%;padding:8px 12px 16px;border-radius:8px;position:relative;font-size:14px}.me{background:#005c4b;align-self:flex-end}.other{background:#202c33;align-self:flex-start}.overlay{position:fixed;inset:0;background:#0f0f0f;z-index:10;display:none;flex-direction:column}.head{background:#202c33;padding:10px;display:flex;gap:6px}.head input{flex:1;padding:12px;border-radius:20px;border:none;background:#2a3942;color:#fff}.quick{display:flex;gap:6px;padding:8px;overflow:auto;flex-wrap:wrap}.quick button{padding:6px 12px;border-radius:20px;border:none;background:#202c33;color:#fff;white-space:nowrap}iframe{border:none;width:100%;flex:1;background:#000}#form{background:#202c33;padding:6px;display:flex;gap:4px}#form input{flex:1;padding:11px;border-radius:20px;border:none;background:#2a3942;color:#fff}#form button{width:38px;height:38px;border-radius:50%;border:none;background:#25D366;color:#fff}#login{position:fixed;inset:0;background:#111b21;z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px}#videoBox{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}</style></head><body>
<aside>
<div onclick="showPage('chat')">💬</div>
<div onclick="showPage('youtube')" class="yt">▶️</div>
<div onclick="showPage('google')" style="background:#4285F4">G</div>
<div onclick="showPage('contacts')">📇</div>
<div onclick="openCall()">📹</div>
<div style="margin-top:auto;background:#25D366;font-weight:bold">F</div>
</aside>
<div id="main">
<header><input id="search" placeholder="🔍 Chercher dans chat..." oninput="doSearch(this.value)"></header>
<div style="background:#202c33;padding:6px 10px;font-size:12px"><b id="chatName">FREDDY FINAL</b> <small id="typing" style="color:#53bdeb"></small></div>
<div id="msgs"></div>
<div id="searchRes" style="display:none;flex:1;overflow:auto;padding:10px;background:#0b141a"></div>
<div id="form"><input id="text" type="text" placeholder="Message..."><input type="file" id="file" accept="image/*,video/*" style="display:none"><button onclick="document.getElementById('file').click()">📷</button><button id="mic" onclick="recVoice()">🎤</button><button onclick="send()">➤</button></div>
</div>
<div id="youtube" class="overlay">
<div class="head"><input id="ytSearch" placeholder="🔍 YouTube: cours maths, physique, Fally..."><button onclick="searchYT()" style="background:#FF0000;color:#fff;padding:10px 18px;border-radius:20px;border:none">▶️</button><button onclick="hidePages()" style="background:#333;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div>
<div class="quick"><button onclick="quickYT('cours mathématiques')">📐 Maths</button><button onclick="quickYT('cours physique chimie')">⚗️ Physique</button><button onclick="quickYT('cours SVT biologie')">🧬 SVT</button><button onclick="quickYT('informatique programmation')">💻 Info</button><button onclick="quickYT('musique congolaise')">🎵 Musique</button><button onclick="quickYT('théorème Pythagore')">📚 Pythagore</button></div>
<iframe id="ytFrame" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
</div>
<div id="googlePage" class="overlay">
<div class="head"><input id="gSearch" placeholder="🔍 Google..."><button onclick="searchG()" style="background:#4285F4;color:#fff;padding:10px 18px;border-radius:20px;border:none">G</button><button onclick="hidePages()" style="background:#333;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div>
<iframe id="gFrame"></iframe>
</div>
<div id="contacts" class="overlay"><div class="head"><h3 style="flex:1">📇 Contacts</h3><button onclick="hidePages()" style="background:red;color:#fff;padding:8px 14px;border-radius:20px;border:none">❌</button></div><div style="padding:10px"><div style="display:flex;gap:6px"><input id="cName" placeholder="Nom" style="flex:1;padding:10px;border-radius:8px;border:none"><input id="cNum" placeholder="Numéro" style="flex:1;padding:10px;border-radius:8px;border:none"><button onclick="addContact()" style="padding:10px;background:#25D366;border:none;border-radius:8px">+</button></div><div id="cList"></div></div></div>
<div id="videoBox"><div style="background:#202c33;padding:10px;display:flex;justify-content:space-between"><span id="vTitle">📹 Appel</span><span onclick="document.getElementById('videoBox').style.display='none';document.getElementById('vFrame').src=''" style="background:red;padding:6px 14px;border-radius:20px">❌</span></div><iframe id="vFrame" allow="camera;microphone" style="flex:1;border:none"></iframe></div>
<div id="login"><h1 style="color:#25D366">FREDDY FINAL N°1</h1><p>YouTube FIX - plus de "unavailable"</p><input id="myName" placeholder="Ton prénom" style="padding:14px;width:100%;max-width:300px;border-radius:8px;border:none;margin:10px"><button onclick="saveName()" style="padding:14px;width:100%;max-width:300px;background:#25D366;border:none;border-radius:8px;color:#fff;font-weight:bold">ENTRER 🚀</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,push,onChildAdded,set,onValue}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={apiKey:"AIzaSyDfY6UU7H6tkhFX2BCm17haprCP-gBDmhY",authDomain:"freddy-chat-be9da.firebaseapp.com",databaseURL:"https://freddy-chat-be9da-default-rtdb.firebaseio.com",projectId:"freddy-chat-be9da",appId:"1:383693224398:web:7c1f193021bec3c962139f"};
const app=initializeApp(cfg);const db=getDatabase(app);
let me=localStorage.getItem("freddy_name")||"";if(me)document.getElementById("login").style.display="none";
window.saveName=()=>{let v=document.getElementById("myName").value.trim();if(!v)return;me=v;localStorage.setItem("freddy_name",v);document.getElementById("login").style.display="none"};
let contacts=JSON.parse(localStorage.getItem("freddy_contacts")||"[]");let allMsgs=[];
window.showPage=(p)=>{hidePages();document.getElementById(p=="chat"?"main":p=="youtube"?"youtube":p=="google"?"googlePage":p=="contacts"?"contacts":"main").style.display="flex";if(p=="contacts")renderC();if(p=="youtube"&&!document.getElementById("ytFrame").src)searchYT("cours mathématiques");if(p=="google"&&!document.getElementById("gFrame").src)searchG("cours")};
window.hidePages=()=>{document.querySelectorAll('.overlay').forEach(e=>e.style.display='none');document.getElementById("searchRes").style.display="none";document.getElementById("msgs").style.display="flex"};
window.addContact=()=>{let n=document.getElementById("cName").value.trim(),num=document.getElementById("cNum").value.trim();if(!n)return;contacts.push({name:n,num});localStorage.setItem("freddy_contacts",JSON.stringify(contacts));document.getElementById("cName").value="";document.getElementById("cNum").value="";renderC()};
function renderC(){let l=document.getElementById("cList");l.innerHTML="";contacts.forEach((c,i)=>{let d=document.createElement("div");d.style.cssText="background:#202c33;padding:10px;border-radius:10px;margin:6px;display:flex;justify-content:space-between";d.innerHTML=`<div><b>${c.name}</b><br><small>${c.num}</small></div><div><span onclick="openCall('${c.name}')" style="background:#25D366;padding:8px 12px;border-radius:20px">📞</span> <span onclick="contacts.splice(${i},1);localStorage.setItem('freddy_contacts',JSON.stringify(contacts));renderC()">🗑️</span></div>`;l.appendChild(d)})}
window.openCall=(who="MONDE")=>{document.getElementById("videoBox").style.display="flex";document.getElementById("vTitle").innerText="📹 "+who;document.getElementById("vFrame").src="https://meet.jit.si/FREDDY-"+encodeURIComponent(who)+"-"+Date.now()};
window.send=()=>{let t=document.getElementById("text").value.trim();if(!t)return;document.getElementById("text").value="";push(ref(db,"messages"),{name:me,text:t,time:Date.now()});set(ref(db,"typing/"+me),{typing:false})};
let rec,chunks=[];window.recVoice=async()=>{let b=document.getElementById("mic");try{if(!rec||rec.state=="inactive"){let s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let r=new FileReader();r.onload=()=>push(ref(db,"messages"),{name:me,text:"🎤 Vocal",time:Date.now(),audio:r.result});r.readAsDataURL(blob)};rec.start();b.innerText="⏹️";b.style.background="red"}else{rec.stop();b.innerText="🎤";b.style.background="#25D366"}}catch{alert("Micro bloqué")}};
onChildAdded(ref(db,"messages"),s=>{let m=s.val();allMsgs.push(m);let d=document.getElementById("msgs");let isMe=m.name==me;let el=document.createElement("div");el.className="msg "+(isMe?"me":"other");let media="";if(m.img)media=`<img src="${m.img}" style="max-width:200px;border-radius:8px;display:block;margin-top:4px">`;if(m.video)media+=`<video controls src="${m.video}" style="max-width:200px;border-radius:8px;display:block;margin-top:4px"></video>`;if(m.audio)media+=`<audio controls src="${m.audio}" style="max-width:200px"></audio>`;el.innerHTML=`<b style="font-size:11px;color:#53bdeb">${m.name}</b><div>${(m.text||'').replace(/</g,'&lt;')}${media}</div><span style="position:absolute;bottom:2px;right:6px;font-size:10px;opacity:.6">${new Date(m.time).toLocaleTimeString().slice(0,5)}</span>`;d.appendChild(el);d.scrollTop=99999});
document.getElementById("text").addEventListener("input",()=>{set(ref(db,"typing/"+me),{typing:true,name:me});clearTimeout(window.tt);window.tt=setTimeout(()=>set(ref(db,"typing/"+me),{typing:false}),1500)});
onValue(ref(db,"typing"),snap=>{let v=snap.val()||{};let txt="";for(let k in v){if(v[k].typing&&k!=me)txt=`${v[k].name} écrit...`}document.getElementById("typing").innerText=txt});
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{if(f.type.startsWith("video"))push(ref(db,"messages"),{name:me,text:"🎥 Vidéo",time:Date.now(),video:r.result});else push(ref(db,"messages"),{name:me,text:"📸 Photo",time:Date.now(),img:r.result})};r.readAsDataURL(f)});
document.getElementById("text").addEventListener("keydown",e=>{if(e.key=="Enter")send()});
window.doSearch=(q)=>{if(!q.trim()){hidePages();return}q=q.toLowerCase();let res=document.getElementById("searchRes");res.style.display="flex";res.style.flexDirection="column";document.getElementById("msgs").style.display="none";let h=`<h3>🔍 "${q}"</h3>`;let f=0;allMsgs.forEach(m=>{if((m.text||"").toLowerCase().includes(q)){h+=`<div style="background:#202c33;padding:8px;border-radius:8px;margin:4px"><b>${m.name}</b>: ${m.text}</div>`;f++}});if(!f)h+=`<p>Rien. Cherche sur YouTube !</p><button onclick="document.getElementById('ytSearch').value='${q}';showPage('youtube');searchYT()" style="background:red;padding:10px;border:none;border-radius:8px;color:#fff">YouTube ▶️</button>`;h+=`<button onclick="hidePages()" style="margin-top:10px;padding:10px;background:#25D366;border:none;border-radius:8px">Retour</button>`;res.innerHTML=h};

// YOUTUBE FIX - PLUS DE "UNAVAILABLE"
window.searchYT=(preset)=>{
let q=preset||document.getElementById("ytSearch").value.trim();
if(!q)q="cours mathématiques";
document.getElementById("ytSearch").value=q;
// On utilise Invidious qui ne bloque pas - plus de erreur
document.getElementById("ytFrame").src="https://yewtu.be/search?q="+encodeURIComponent(q);
};
window.quickYT=(q)=>searchYT(q);

// GOOGLE FIX
window.searchG=(preset)=>{
let q=preset||document.getElementById("gSearch").value.trim();
if(!q)q="cours";
document.getElementById("gSearch").value=q;
document.getElementById("gFrame").src="https://duckduckgo.com/?q="+encodeURIComponent(q)+"&ia=web";
};
window.quickG=(q)=>searchG(q);
</script></body></html>
