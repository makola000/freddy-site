<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FREDDY V2 N°1</title><link rel="manifest" href='data:application/json;base64,eyJuYW1lIjoiRlJFRERZIFYyIE4xIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzExMWIyMSIsInRoZW1lX2NvbG9yIjoiIzI1RDM2NiJ9'><meta name="theme-color" content="#25D366"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#111b21;color:#fff;display:flex;height:100vh}aside{width:80px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column;align-items:center;padding:10px;gap:10px}aside div{width:48px;height:48px;background:#202c33;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}aside .active{background:#25D366}#main{flex:1;display:flex;flex-direction:column}header{background:#202c33;padding:10px;display:flex;justify-content:space-between;align-items:center}#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.msg{max-width:78%;padding:8px 12px 18px;border-radius:8px;position:relative}.me{background:#005c4b;align-self:flex-end}.other{background:#202c33;align-self:flex-start}.time{position:absolute;bottom:2px;right:6px;font-size:10px;opacity:.7}.msg img{max-width:200px;border-radius:8px;display:block;margin-top:4px}.msg audio{max-width:200px;margin-top:5px}#form{background:#202c33;padding:8px;display:flex;gap:6px;align-items:center}#form input{flex:1;padding:12px;border-radius:20px;border:none;background:#2a3942;color:#fff}#form button{width:42px;height:42px;border-radius:50%;border:none;background:#25D366;color:#fff;cursor:pointer}.overlay{position:fixed;inset:0;background:#111b21;z-index:15;display:none;flex-direction:column;padding:15px;overflow:auto}.contact{background:#202c33;padding:12px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}.status{background:#202c33;padding:10px;border-radius:12px;margin:8px 0;display:flex;gap:10px;align-items:center}.status img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #25D366}#videoBox{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}#videoBox iframe{flex:1;border:none}#login{position:fixed;inset:0;background:#111b21;z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px}</style></head><body>
<aside><div onclick="showPage('contacts')">📇</div><div onclick="showPage('status')">📸</div><div onclick="showPage('chat')">💬</div><div onclick="openVideo('MONDE')">📹</div><div style="margin-top:auto;background:#25D366">F</div></aside>
<div id="main"><header><div><b id="chatName">FREDDY V2 N°1</b> <span style="color:#25D366;font-size:11px"> ● N°1 MONDIAL</span><br><small id="typing" style="color:#53bdeb"></small></div><div><span onclick="openVideo(document.getElementById('chatName').innerText)" style="background:#25D366;padding:6px 14px;border-radius:20px;cursor:pointer">📹</span> <span onclick="showPage('contacts')" style="cursor:pointer;margin-left:8px">📞</span></div></header><div id="msgs"></div><div id="form"><input id="text" type="text" placeholder="Message..."><input type="file" id="img" accept="image/*" style="display:none"><button onclick="document.getElementById('img').click()">📷</button><button id="micBtn" onclick="toggleRec()">🎤</button><button onclick="send()">➤</button></div></div>
<div id="contacts" class="overlay"><h2>📇 Contacts <span onclick="hidePages()" style="float:right;background:red;padding:6px 12px;border-radius:20px;cursor:pointer">❌</span></h2><div style="display:flex;gap:6px;margin:12px 0"><input id="cName" placeholder="Nom" style="flex:1;padding:12px;border-radius:8px;border:none"><input id="cNum" placeholder="Numéro" style="flex:1;padding:12px;border-radius:8px;border:none"><button onclick="addContact()" style="padding:12px;background:#25D366;border:none;border-radius:8px">+</button></div><div id="cList"></div></div>
<div id="statusPage" class="overlay"><h2>📸 Statuts 24h <span onclick="hidePages()" style="float:right;background:red;padding:6px 12px;border-radius:20px;cursor:pointer">❌</span></h2><div style="display:flex;gap:6px;margin:12px 0"><input id="sText" placeholder="Ton statut..." style="flex:1;padding:12px;border-radius:8px;border:none"><input type="file" id="sImg" accept="image/*" style="display:none"><button onclick="document.getElementById('sImg').click()" style="padding:12px;background:#2a3942;border:none;border-radius:8px">📷</button><button onclick="addStatus()" style="padding:12px;background:#25D366;border:none;border-radius:8px">Poster</button></div><div id="sList"></div><small style="opacity:.6">Les statuts disparaissent après 24h comme WhatsApp</small></div>
<div id="videoBox"><div style="background:#202c33;padding:10px;display:flex;justify-content:space-between"><span id="videoTitle">📹 Appel</span><span onclick="document.getElementById('videoBox').style.display='none';document.getElementById('videoFrame').src=''" style="background:red;padding:6px 14px;border-radius:20px">❌ Raccrocher</span></div><iframe id="videoFrame" allow="camera;microphone"></iframe></div>
<div id="login"><h1 style="color:#25D366">FREDDY V2 N°1 🌍</h1><p>Audio + Statuts - Dépasse WhatsApp</p><input id="name" placeholder="Ton prénom" style="padding:14px;width:100%;max-width:300px;border-radius:8px;border:none;margin:10px"><button onclick="save()" style="padding:14px;width:100%;max-width:300px;background:#25D366;border:none;border-radius:8px;color:#fff;font-weight:bold">DEVENIR N°1 🚀</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,push,onChildAdded,set,onValue}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const config={apiKey:"AIzaSyDfY6UU7H6tkhFX2BCm17haprCP-gBDmhY",authDomain:"freddy-chat-be9da.firebaseapp.com",databaseURL:"https://freddy-chat-be9da-default-rtdb.firebaseio.com",projectId:"freddy-chat-be9da",appId:"1:383693224398:web:7c1f193021bec3c962139f"};
const app=initializeApp(config);const db=getDatabase(app);
let myName=localStorage.getItem("freddy_name")||"";if(myName)document.getElementById("login").style.display="none";
window.save=()=>{let v=document.getElementById("name").value.trim();if(!v)return;myName=v;localStorage.setItem("freddy_name",v);document.getElementById("login").style.display="none"};
let contacts=JSON.parse(localStorage.getItem("freddy_contacts")||"[]");
window.showPage=(p)=>{hidePages();if(p=='contacts'){document.getElementById("contacts").style.display="flex";renderContacts()} if(p=='status'){document.getElementById("statusPage").style.display="flex"} if(p=='chat'){}};
window.hidePages=()=>{document.getElementById("contacts").style.display="none";document.getElementById("statusPage").style.display="none"};
window.addContact=()=>{let n=document.getElementById("cName").value.trim(),num=document.getElementById("cNum").value.trim();if(!n)return;contacts.push({name:n,num});localStorage.setItem("freddy_contacts",JSON.stringify(contacts));document.getElementById("cName").value="";document.getElementById("cNum").value="";renderContacts()};
function renderContacts(){let l=document.getElementById("cList");l.innerHTML="";contacts.forEach((c,i)=>{let d=document.createElement("div");d.className="contact";d.innerHTML=`<div><b>${c.name}</b><br><small>${c.num}</small></div><div><span onclick="callContact('${c.name}')" style="background:#25D366;padding:8px 12px;border-radius:20px;cursor:pointer">📞</span> <span onclick="chatContact('${c.name}')" style="background:#2a3942;padding:8px 12px;border-radius:20px;cursor:pointer">💬</span> <span onclick="contacts.splice(${i},1);localStorage.setItem('freddy_contacts',JSON.stringify(contacts));renderContacts()" style="cursor:pointer">🗑️</span></div>`;l.appendChild(d)})}
window.callContact=n=>{openVideo(n)};window.chatContact=n=>{document.getElementById("chatName").innerText=n;hidePages()};
window.openVideo=(who)=>{document.getElementById("videoBox").style.display="flex";document.getElementById("videoTitle").innerText="📹 "+who;document.getElementById("videoFrame").src="https://meet.jit.si/FREDDY-V2-"+encodeURIComponent(who)+"-"+Date.now()};
window.send=()=>{let t=document.getElementById("text").value.trim();if(!t)return;document.getElementById("text").value="";push(ref(db,"messages"),{name:myName,to:document.getElementById("chatName").innerText,text:t,time:Date.now()});set(ref(db,"typing/"+myName),{typing:false})};
let rec,chunks=[];window.toggleRec=async()=>{let btn=document.getElementById("micBtn");try{if(!rec||rec.state=="inactive"){let stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let r=new FileReader();r.onload=()=>push(ref(db,"messages"),{name:myName,text:"🎤 Vocal",time:Date.now(),audio:r.result});r.readAsDataURL(blob)};rec.start();btn.innerText="⏹️";btn.style.background="red"}else{rec.stop();btn.innerText="🎤";btn.style.background="#25D366"}}catch(e){alert("Micro non autorisé - active le micro")}}; 
onChildAdded(ref(db,"messages"),s=>{let m=s.val();let div=document.getElementById("msgs");let isMe=m.name==myName;let el=document.createElement("div");el.className="msg "+(isMe?"me":"other");let h=`<b style="font-size:11px;color:#53bdeb">${m.name}${m.to?' → '+m.to:''}</b><div>${m.text||''}${m.img?'<br><img src='+m.img+'>':''}${m.audio?'<br><audio controls src='+m.audio+'></audio>':''}</div>`;h+=`<span class="time">${new Date(m.time).toLocaleTimeString().slice(0,5)} ${isMe?'✓✓':''}</span>`;el.innerHTML=h;div.appendChild(el);div.scrollTop=99999});
document.getElementById("text").addEventListener("input",()=>{set(ref(db,"typing/"+myName),{typing:true,name:myName});clearTimeout(window.typTimeout);window.typTimeout=setTimeout(()=>set(ref(db,"typing/"+myName),{typing:false}),1500)});
onValue(ref(db,"typing"),snap=>{let v=snap.val()||{};let txt="";for(let k in v){if(v[k].typing&&k!=myName)txt=`${v[k].name} écrit...`}document.getElementById("typing").innerText=txt});
document.getElementById("img").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>push(ref(db,"messages"),{name:myName,text:"📸 Photo",time:Date.now(),img:r.result});r.readAsDataURL(f)});
document.getElementById("text").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
let tempStatusImg="";document.getElementById("sImg").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>tempStatusImg=r.result;r.readAsDataURL(f)});
window.addStatus=()=>{let t=document.getElementById("sText").value.trim();if(!t&&!tempStatusImg)return;push(ref(db,"statuses"),{name:myName,text:t,img:tempStatusImg,time:Date.now()});document.getElementById("sText").value="";tempStatusImg=""};
onChildAdded(ref(db,"statuses"),s=>{let m=s.val();if(Date.now()-m.time>86400000)return;let l=document.getElementById("sList");let d=document.createElement("div");d.className="status";d.innerHTML=`${m.img?'<img src='+m.img+'>':'<div style="width:50px;height:50px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center">'+m.name[0]+'</div>'}<div><b>${m.name}</b><br><small>${m.text||''} • ${new Date(m.time).toLocaleTimeString().slice(0,5)}</small></div>`;l.prepend(d)});
</script></body></html>
