<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FREDDY ULTIME</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0b141a;color:#fff;display:flex;flex-direction:column;height:100vh}header{background:#202c33;padding:12px;display:flex;justify-content:space-between}header b{color:#25D366} #messages{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px} .msg{max-width:75%;padding:8px 10px 18px;border-radius:8px;position:relative} .me{background:#005c4b;align-self:flex-end} .other{background:#202c33;align-self:flex-start} .time{position:absolute;bottom:2px;right:6px;font-size:10px;opacity:.6} .del{position:absolute;top:0;right:4px;cursor:pointer;font-size:12px} .msg img{max-width:200px;border-radius:8px;margin-top:5px;display:block} #form{background:#202c33;padding:8px;display:flex;gap:6px} #form input[type=text]{flex:1;padding:12px;border-radius:20px;border:none;background:#2a3942;color:#fff} #form button{width:42px;height:42px;border-radius:50%;border:none;background:#25D366;color:#fff} #login{position:fixed;inset:0;background:#111b21;z-index:9;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px} #emoji{display:none;padding:8px;background:#202c33;flex-wrap:wrap;gap:4px} #emoji span{font-size:22px;cursor:pointer}</style></head><body>
<header><div><b>FREDDY</b> CHAT PRO <span style="color:#25D366;font-size:11px">● LIVE</span></div><div><span onclick="if(confirm('Tout effacer ?')){import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js').then(m=>{const{getDatabase,ref,remove}=m;const db=getDatabase();remove(ref(db,'messages'));document.getElementById('messages').innerHTML=''})}"><i>🗑️</i></span></div></header>
<div id="messages"></div>
<div id="emoji"><span onclick="addE('😍')">😍</span><span onclick="addE('🔥')">🔥</span><span onclick="addE('😂')">😂</span><span onclick="addE('❤️')">❤️</span><span onclick="addE('🙏')">🙏</span><span onclick="addE('💪')">💪</span><span onclick="addE('🥰')">🥰</span><span onclick="addE('😭')">😭</span><span onclick="addE('👍')">👍</span><span onclick="addE('😎')">😎</span></div>
<div id="form"><button onclick="document.getElementById('emoji').style.display=document.getElementById('emoji').style.display=='flex'?'none':'flex'">😊</button><input id="text" type="text" placeholder="Message..."><input type="file" id="img" accept="image/*" style="display:none"><button onclick="document.getElementById('img').click()">📷</button><button onclick="rec()">🎤</button><button onclick="send()">➤</button></div>
<div id="login"><h2 style="color:#25D366">FREDDY CHAT ULTIME</h2><input id="name" placeholder="Ton prénom" style="padding:14px;width:100%;max-width:300px;border-radius:8px;border:none;margin:10px"><button onclick="save()" style="padding:14px;width:100%;max-width:300px;background:#25D366;border:none;border-radius:8px;color:#fff;font-weight:bold">ENTRER 🚀</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,push,onChildAdded,remove}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const config={apiKey:"AIzaSyDfY6UU7H6tkhFX2BCm17haprCP-gBDmhY",authDomain:"freddy-chat-be9da.firebaseapp.com",databaseURL:"https://freddy-chat-be9da-default-rtdb.firebaseio.com",projectId:"freddy-chat-be9da",appId:"1:383693224398:web:7c1f193021bec3c962139f"};
const app=initializeApp(config);const db=getDatabase(app);
let myName=localStorage.getItem("freddy_name")||"";if(myName)document.getElementById("login").style.display="none";
window.save=()=>{let v=document.getElementById("name").value.trim();if(!v)return alert("Prénom");myName=v;localStorage.setItem("freddy_name",v);document.getElementById("login").style.display="none"};
window.addE=e=>document.getElementById("text").value+=e;
window.send=(t=0,img=0,audio=0)=>{let text=t||document.getElementById("text").value.trim();if(!text&&!img&&!audio)return;document.getElementById("text").value="";push(ref(db,"messages"),{name:myName,text,time:Date.now(),img:img||"",audio:audio||""})};
onChildAdded(ref(db,"messages"),s=>{let m=s.val();let id=s.key;let div=document.getElementById("messages");let isMe=m.name==myName;let el=document.createElement("div");el.className="msg "+(isMe?"me":"other");let h=`<b style="font-size:11px;color:#53bdeb">${m.name}</b>`;if(m.text)h+=`<div>${m.text}</div>`;if(m.img)h+=`<img src="${m.img}">`;if(m.audio)h+=`<audio controls src="${m.audio}" style="width:180px"></audio>`;h+=`<span class="time">${new Date(m.time).toLocaleTimeString().slice(0,5)}</span><span class="del" onclick="this.parentElement.remove();fetch('https://freddy-chat-be9da-default-rtdb.firebaseio.com/messages/${id}.json',{method:'DELETE'})">x</span>`;el.innerHTML=h;div.appendChild(el);div.scrollTop=99999;try{new Audio("https://cdn.pixabay.com/audio/2021/08/04/audio_0625c1539c.mp3").play()}catch(e){}});
document.getElementById("img").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>send("📸 Photo",r.result,"");r.readAsDataURL(f)});
let recoder,chunks=[];window.rec=async()=>{if(recoder&&recoder.state=="recording"){recoder.stop();return}let st=await navigator.mediaDevices.getUserMedia({audio:true});recoder=new MediaRecorder(st);chunks=[];recoder.ondataavailable=x=>chunks.push(x.data);recoder.onstop=()=>{let b=new Blob(chunks,{type:"audio/webm"});let r=new FileReader();r.onload=()=>send("🎤 Vocal","",r.result);r.readAsDataURL(b)};recoder.start();alert("Parle... clique encore sur 🎤 pour envoyer");};
</script></body></html>
