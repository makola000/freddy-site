<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY CHAT - MONDIAL 🌍</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#111b21;color:white;display:flex;flex-direction:column;height:100vh}
.header{background:#202c33;padding:15px;text-align:center;font-weight:bold;font-size:20px;color:#25D366}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:10px 14px;border-radius:10px;word-break:break-word}
.me{align-self:flex-end;background:#005c4b}
.other{align-self:flex-start;background:#202c33}
.input-area{display:flex;padding:10px;background:#202c33;gap:8px}
input{padding:12px;border-radius:20px;border:none;outline:none}
#nameInput{width:90px}
#msgInput{flex:1}
button{padding:12px 18px;border-radius:20px;border:none;background:#25D366;color:white;font-weight:bold}
</style>
</head>
<body>
<div class="header">FREDDY CHAT 🌍 MONDIAL</div>
<div id="messages"></div>
<div class="input-area">
<input id="nameInput" placeholder="Nom">
<input id="msgInput" placeholder="Message...">
<button onclick="send()">Envoyer</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDfdD2GeWkP3_jR0UOF8XOo0YY2OHhh7_A",
  authDomain: "freddy-chat-d7685.firebaseapp.com",
  databaseURL: "https://freddy-chat-d7685-default-rtdb.firebaseio.com",
  projectId: "freddy-chat-d7685",
  storageBucket: "freddy-chat-d7685.firebasestorage.app",
  messagingSenderId: "995847135839",
  appId: "1:995847135839:web:cb599b4ec1798a7a0cb1ea",
  measurementId: "G-8SJX6NZFX9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const chatRef = ref(db, "messages");

const messagesDiv = document.getElementById("messages");

onChildAdded(chatRef, (snap) => {
  const data = snap.val();
  const div = document.createElement("div");
  const myName = document.getElementById("nameInput").value;
  div.className = "msg " + (data.name === myName ? "me" : "other");
  div.innerHTML = `<b>${data.name}</b><br>${data.text}`;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
});

window.send = function() {
  const name = document.getElementById("nameInput").value || "Anonyme";
  const text = document.getElementById("msgInput").value;
  if(!text.trim()) return;
  push(chatRef, { name: name, text: text, time: Date.now() });
  document.getElementById("msgInput").value = "";
}

document.getElementById("msgInput").addEventListener("keydown", (e)=>{
  if(e.key==="Enter") send();
});
</script>
</body>
</html>
