<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freddy V8 - Tout en Un</title>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#fff}
header{padding:15px;text-align:center;background:#1e293b;position:sticky;top:0}
.search{max-width:650px;margin:15px auto;display:flex;gap:6px;padding:0 10px}
.search input{flex:1;padding:13px;border-radius:25px;border:none;outline:none}
.search button{padding:13px 20px;border-radius:25px;border:none;background:#25D366;color:#fff;font-weight:bold}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px}
.tab{padding:8px 14px;background:#334155;border-radius:20px;cursor:pointer}
.tab.act{background:#25D366;color:#000;font-weight:bold}
#view{height:75vh;background:#fff;border-radius:12px;margin:10px;overflow:hidden}
iframe{width:100%;height:100%;border:none}
</style></head><body>
<header><h2>🚀 Freddy V8 - Recherche Totale</h2></header>
<div class="search"><input id="q" placeholder="Chercher une personne, vidéo, lieu..." onkeydown="if(event.key==='Enter')go()"><button onclick="go()">GO</button></div>
<div class="tabs">
<div id="t-g" class="tab act" onclick="openT('g')">Google</div>
<div id="t-yt" class="tab" onclick="openT('yt')">YouTube</div>
<div id="t-w" class="tab" onclick="openT('w')">Wiki</div>
<div id="t-wa" class="tab" onclick="openT('wa')">WhatsApp</div>
<div id="t-fb" class="tab" onclick="openT('fb')">Facebook</div>
<div id="t-m" class="tab" onclick="openT('m')">Maps</div>
</div>
<div id="view"></div>
<script>
let cur='g';
function openT(t){cur=t;document.querySelectorAll('.tab').forEach(e=>e.classList.remove('act'));document.getElementById('t-'+t).classList.add('act');go();}
function go(){
let q=document.getElementById('q').value||'Kinshasa';
let v=document.getElementById('view');
if(cur==='g') v.innerHTML=`<iframe src="https://www.google.com/search?q=${encodeURIComponent(q)}&igu=1"></iframe>`;
if(cur==='yt') v.innerHTML=`<iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(q)}"></iframe>`;
if(cur==='w') v.innerHTML=`<iframe src="https://fr.wikipedia.org/wiki/${encodeURIComponent(q)}"></iframe>`;
if(cur==='wa') v.innerHTML=`<iframe src="https://wa.me/?text=${encodeURIComponent(q)}"></iframe>`;
if(cur==='fb') v.innerHTML=`<iframe src="https://www.facebook.com/search/top/?q=${encodeURIComponent(q)}"></iframe>`;
if(cur==='m') v.innerHTML=`<iframe src="https://www.google.com/maps/search/${encodeURIComponent(q)}/"></iframe>`;
}
go();
</script></body></html>
