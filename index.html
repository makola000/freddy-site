<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freddy</title></head><body style="background:#000;color:#0f0;padding:20px;font-family:Arial"><h1>FREDDY CHAT ULTIME - EN DIRECT</h1><div id="box"><input id="username" placeholder="Ton prenom"><button onclick="saveName()">ENTRER</button></div><div id="messages"></div><div><input id="text" placeholder="Message"><button onclick="sendMsg()">Envoyer</button></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,push,onChildAdded}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyDfY6UU7H6tkhFX2BCm17haprCP-gBDmhY",authDomain:"freddy-chat-be9da.firebaseapp.com",databaseURL:"https://freddy-chat-be9da-default-rtdb.firebaseio.com",projectId:"freddy-chat-be9da",storageBucket:"freddy-chat-be9da.firebasestorage.app",messagingSenderId:"383693224398",appId:"1:383693224398:web:7c1f193021bec3c962139f"};const app=initializeApp(firebaseConfig);const db=getDatabase(app);let myName="";window.saveName=()=>{myName=document.getElementById("username").value;document.getElementById("box").innerHTML="Bienvenue "+myName};window.sendMsg=()=>{const t=document.getElementById("text").value;push(ref(db,"messages"),{name:myName,text:t,time:Date.now()})};onChildAdded(ref(db,"messages"),d=>{const m=d.val();document.getElementById("messages").innerHTML+=`<p><b>${m.name}:</b> ${m.text}</p>`})</script></body></html>
